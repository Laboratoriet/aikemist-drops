<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slug Generator | aikemist.com</title>
  <meta name="description" content="Convert text to URL-friendly slugs instantly. Multiple styles, custom separators, length limits.">
  <meta property="og:title" content="Slug Generator">
  <meta property="og:description" content="Convert text to URL-friendly slugs instantly. Multiple styles, custom separators, length limits.">
  <meta property="og:image" content="https://day059.aikemist.com/og.png">
  <meta property="og:url" content="https://day059.aikemist.com">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg: #fafafa;
      --bg-card: #ffffff;
      --text: #1a1a2e;
      --text-muted: #6b7280;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --accent-soft: rgba(34, 197, 94, 0.1);
      --border: #e5e7eb;
      --input-bg: #f9fafb;
      --success: #10b981;
    }
    
    [data-theme="dark"] {
      --bg: #0a0a0f;
      --bg-card: #12121a;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --input-bg: #1e1e2e;
    }
    
    body {
      font-family: 'Jost', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      transition: background 0.3s, color 0.3s;
    }
    
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--accent), #4ade80);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .tagline {
      color: var(--text-muted);
      font-size: 1.1rem;
    }
    
    .theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      cursor: pointer;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
      z-index: 100;
    }
    
    .theme-toggle:hover {
      transform: scale(1.1);
    }
    
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    
    /* Input */
    .input-group {
      margin-bottom: 1.5rem;
    }
    
    .input-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    
    input[type="text"] {
      width: 100%;
      font-family: 'Jost', sans-serif;
      font-size: 1.1rem;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--input-bg);
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    
    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    
    /* Options */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    
    @media (max-width: 600px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
    }
    
    .option-group label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.375rem;
    }
    
    select, input[type="number"] {
      width: 100%;
      font-family: 'Jost', sans-serif;
      font-size: 0.9rem;
      padding: 0.625rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--text);
      cursor: pointer;
    }
    
    select:focus, input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
    }
    
    /* Output */
    .output-section {
      margin-bottom: 1.5rem;
    }
    
    .output-box {
      position: relative;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.1rem;
      padding: 1rem;
      padding-right: 4rem;
      background: var(--accent-soft);
      border: 2px solid var(--accent);
      border-radius: 10px;
      color: var(--accent);
      min-height: 56px;
      word-break: break-all;
    }
    
    .output-placeholder {
      color: var(--text-muted);
      font-style: italic;
    }
    
    .copy-btn {
      position: absolute;
      top: 50%;
      right: 0.75rem;
      transform: translateY(-50%);
      font-family: 'Jost', sans-serif;
      font-size: 0.8rem;
      padding: 0.5rem 0.75rem;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .copy-btn:hover {
      background: var(--accent-hover);
    }
    
    /* Stats */
    .stats {
      display: flex;
      gap: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.75rem;
    }
    
    .stat-value {
      font-family: 'JetBrains Mono', monospace;
      color: var(--text);
    }
    
    /* Presets */
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    
    .preset-btn {
      font-family: 'Jost', sans-serif;
      font-size: 0.8rem;
      padding: 0.5rem 0.875rem;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--input-bg);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .preset-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    
    /* Actions */
    .actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    
    .action-btn {
      font-family: 'Jost', sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .action-btn:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    
    /* History */
    .history {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }
    
    .history-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }
    
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    
    .history-item {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      padding: 0.5rem 0.75rem;
      background: var(--input-bg);
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .history-item:hover {
      background: var(--accent-soft);
    }
    
    /* Footer */
    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-muted);
      font-size: 0.875rem;
    }
    
    footer a {
      color: var(--accent);
      text-decoration: none;
    }
    
    footer a:hover {
      text-decoration: underline;
    }
    
    .keyboard-hints {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 1rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    
    kbd {
      font-family: 'JetBrains Mono', monospace;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.125rem 0.375rem;
      font-size: 0.7rem;
    }
    
    @media (max-width: 600px) {
      h1 { font-size: 1.75rem; }
      .container { padding: 1rem; }
      .card { padding: 1rem; }
      .keyboard-hints { display: none; }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
  
  <div class="container">
    <header>
      <h1>Slug Generator</h1>
      <p class="tagline">Turn any text into a clean URL slug. Instant and customizable.</p>
    </header>
    
    <div class="card">
      <!-- Input -->
      <div class="input-group">
        <label class="input-label">Enter Text</label>
        <input type="text" id="inputText" placeholder="My Awesome Blog Post Title!">
      </div>
      
      <!-- Options -->
      <div class="options-grid">
        <div class="option-group">
          <label>Separator</label>
          <select id="separator">
            <option value="-">Hyphen (-)</option>
            <option value="_">Underscore (_)</option>
            <option value=".">Dot (.)</option>
            <option value="">None</option>
          </select>
        </div>
        <div class="option-group">
          <label>Case</label>
          <select id="caseType">
            <option value="lower">lowercase</option>
            <option value="upper">UPPERCASE</option>
            <option value="preserve">Preserve</option>
          </select>
        </div>
        <div class="option-group">
          <label>Max Length</label>
          <input type="number" id="maxLength" value="0" min="0" max="200" placeholder="0 = no limit">
        </div>
      </div>
      
      <!-- Presets -->
      <div class="presets">
        <button class="preset-btn" data-text="How to Build a REST API with Node.js">Blog Title</button>
        <button class="preset-btn" data-text="The Quick Brown Fox & Friends! (2024)">With Symbols</button>
        <button class="preset-btn" data-text="Café Déjà Vu: A Story">Accents</button>
        <button class="preset-btn" data-text="  Multiple   Spaces   Here  ">Spaces</button>
      </div>
      
      <!-- Output -->
      <div class="output-section">
        <label class="input-label">Generated Slug</label>
        <div class="output-box" id="outputBox">
          <span class="output-placeholder">Type something above...</span>
          <button class="copy-btn" id="copyBtn" style="display: none;">Copy</button>
        </div>
        <div class="stats">
          <span>Length: <span class="stat-value" id="slugLength">0</span></span>
          <span>Words: <span class="stat-value" id="slugWords">0</span></span>
        </div>
      </div>
      
      <!-- Actions -->
      <div class="actions">
        <button class="action-btn" id="clearBtn">✕ Clear</button>
        <button class="action-btn" id="clearHistoryBtn">🗑️ Clear History</button>
      </div>
      
      <!-- History -->
      <div class="history" id="historySection" style="display: none;">
        <div class="history-title">Recent Slugs</div>
        <div class="history-list" id="historyList"></div>
      </div>
    </div>
    
    <div class="keyboard-hints">
      <span><kbd>Enter</kbd> Copy</span>
      <span><kbd>T</kbd> Theme</span>
    </div>
  </div>
  
  <footer>
    <a href="https://aikemist.com">aikemist.com</a> · Made by <a href="https://alkemist.no">Alkemist</a>
  </footer>
  
  <script>
    // Theme
    const html = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    html.setAttribute('data-theme', savedTheme);
    themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
    
    themeToggle.addEventListener('click', () => {
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
    });
    
    // Elements
    const inputText = document.getElementById('inputText');
    const separator = document.getElementById('separator');
    const caseType = document.getElementById('caseType');
    const maxLength = document.getElementById('maxLength');
    const outputBox = document.getElementById('outputBox');
    const copyBtn = document.getElementById('copyBtn');
    const slugLength = document.getElementById('slugLength');
    const slugWords = document.getElementById('slugWords');
    const historySection = document.getElementById('historySection');
    const historyList = document.getElementById('historyList');
    
    // History
    let history = JSON.parse(localStorage.getItem('slugHistory') || '[]');
    
    // Character map for transliteration
    const charMap = {
      'à': 'a', 'á': 'a', 'â': 'a', 'ã': 'a', 'ä': 'a', 'å': 'a', 'æ': 'ae',
      'ç': 'c', 'è': 'e', 'é': 'e', 'ê': 'e', 'ë': 'e',
      'ì': 'i', 'í': 'i', 'î': 'i', 'ï': 'i',
      'ñ': 'n', 'ò': 'o', 'ó': 'o', 'ô': 'o', 'õ': 'o', 'ö': 'o', 'ø': 'o',
      'ù': 'u', 'ú': 'u', 'û': 'u', 'ü': 'u', 'ý': 'y', 'ÿ': 'y',
      'ß': 'ss', 'œ': 'oe', 'þ': 'th', 'ð': 'd'
    };
    
    // Generate slug
    function generateSlug() {
      let text = inputText.value;
      const sep = separator.value;
      const caseOpt = caseType.value;
      const limit = parseInt(maxLength.value) || 0;
      
      if (!text.trim()) {
        outputBox.innerHTML = '<span class="output-placeholder">Type something above...</span>';
        copyBtn.style.display = 'none';
        slugLength.textContent = '0';
        slugWords.textContent = '0';
        return;
      }
      
      // Transliterate accented characters
      text = text.split('').map(c => charMap[c.toLowerCase()] || c).join('');
      
      // Apply case
      if (caseOpt === 'lower') text = text.toLowerCase();
      else if (caseOpt === 'upper') text = text.toUpperCase();
      
      // Replace non-alphanumeric with separator
      let slug = text
        .replace(/[^a-zA-Z0-9\s-]/g, '')
        .trim()
        .replace(/\s+/g, sep)
        .replace(new RegExp(`${sep === '' ? '-' : '\\' + sep}+`, 'g'), sep);
      
      // Remove leading/trailing separators
      if (sep) {
        slug = slug.replace(new RegExp(`^\\${sep}+|\\${sep}+$`, 'g'), '');
      }
      
      // Apply length limit
      if (limit > 0 && slug.length > limit) {
        slug = slug.substring(0, limit);
        // Don't cut in middle of word if using separator
        if (sep && slug.endsWith(sep)) {
          slug = slug.slice(0, -1);
        } else if (sep) {
          const lastSep = slug.lastIndexOf(sep);
          if (lastSep > limit * 0.5) {
            slug = slug.substring(0, lastSep);
          }
        }
      }
      
      outputBox.innerHTML = slug + '<button class="copy-btn" id="copyBtn">Copy</button>';
      document.getElementById('copyBtn').addEventListener('click', copySlug);
      
      slugLength.textContent = slug.length;
      slugWords.textContent = slug.split(sep || /(?=[A-Z])/).filter(w => w).length;
      
      return slug;
    }
    
    // Copy slug
    function copySlug() {
      const slug = outputBox.textContent.replace('Copy', '').trim();
      if (slug && !slug.includes('Type something')) {
        navigator.clipboard.writeText(slug);
        
        // Add to history
        if (!history.includes(slug)) {
          history.unshift(slug);
          if (history.length > 5) history.pop();
          localStorage.setItem('slugHistory', JSON.stringify(history));
          renderHistory();
        }
        
        const btn = document.getElementById('copyBtn');
        btn.textContent = '✓';
        setTimeout(() => btn.textContent = 'Copy', 1500);
      }
    }
    
    // Render history
    function renderHistory() {
      if (history.length > 0) {
        historySection.style.display = 'block';
        historyList.innerHTML = history.map(slug => 
          `<div class="history-item" data-slug="${slug}">${slug}</div>`
        ).join('');
      } else {
        historySection.style.display = 'none';
      }
    }
    
    // Event listeners
    inputText.addEventListener('input', generateSlug);
    separator.addEventListener('change', generateSlug);
    caseType.addEventListener('change', generateSlug);
    maxLength.addEventListener('input', generateSlug);
    
    // Presets
    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        inputText.value = btn.dataset.text;
        generateSlug();
      });
    });
    
    // History click
    historyList.addEventListener('click', (e) => {
      if (e.target.classList.contains('history-item')) {
        navigator.clipboard.writeText(e.target.dataset.slug);
        e.target.textContent = '✓ Copied!';
        setTimeout(() => e.target.textContent = e.target.dataset.slug, 1500);
      }
    });
    
    // Clear
    document.getElementById('clearBtn').addEventListener('click', () => {
      inputText.value = '';
      generateSlug();
      inputText.focus();
    });
    
    // Clear history
    document.getElementById('clearHistoryBtn').addEventListener('click', () => {
      history = [];
      localStorage.removeItem('slugHistory');
      renderHistory();
    });
    
    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && document.activeElement === inputText) {
        copySlug();
      } else if (e.key.toLowerCase() === 't' && document.activeElement.tagName !== 'INPUT') {
        themeToggle.click();
      }
    });
    
    // Init
    renderHistory();
  </script>
</body>
</html>
