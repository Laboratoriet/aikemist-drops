    <style>
        :root {
            --bg: #fafafa;
            --bg-card: #ffffff;
            --text: #1a1a1a;
            --text-muted: #666666;
            --border: #e5e5e5;
            --accent: #f59e0b;
            --accent-light: #fef3c7;
            --success: #22c55e;
            --mono: 'JetBrains Mono', monospace;
        }

        [data-theme="dark"] {
            --bg: #0a0a0a;
            --bg-card: #141414;
            --text: #f5f5f5;
            --text-muted: #888888;
            --border: #2a2a2a;
            --accent: #fbbf24;
            --accent-light: #422006;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            border-color: var(--accent);
        }

        /* Input Section */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .btn-primary {
            background: var(--accent);
            color: #1a1a1a;
        }

        .btn-primary:hover {
            filter: brightness(1.1);
        }

        .btn-secondary {
            background: var(--accent-light);
            color: var(--accent);
        }

        .btn-secondary:hover {
            background: var(--accent);
            color: #1a1a1a;
        }

        .btn-icon {
            padding: 0.5rem;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .btn-icon:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        textarea {
            width: 100%;
            min-height: 120px;
            font-family: var(--mono);
            font-size: 0.875rem;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        /* File Zone */
        .file-zone {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1rem;
        }

        .file-zone:hover, .file-zone.dragover {
            border-color: var(--accent);
            background: var(--accent-light);
        }

        .file-zone-text {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .file-zone-text strong {
            color: var(--accent);
        }

        .file-input {
            display: none;
        }

        .file-name {
            font-family: var(--mono);
            font-size: 0.8rem;
            color: var(--accent);
            margin-top: 0.5rem;
            display: none;
        }

        .file-name.show {
            display: block;
        }

        /* Hash Results */
        .hash-results {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .hash-row {
            display: flex;
            align-items: stretch;
            gap: 0.75rem;
            background: var(--bg);
            border-radius: 10px;
            padding: 0.875rem;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .hash-row:hover {
            background: var(--accent-light);
            border-color: var(--accent);
            transform: translateX(4px);
        }

        .hash-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--accent);
            min-width: 70px;
            display: flex;
            align-items: center;
            font-family: var(--mono);
        }

        .hash-value {
            flex: 1;
            font-family: var(--mono);
            font-size: 0.75rem;
            word-break: break-all;
            line-height: 1.5;
            color: var(--text);
            display: flex;
            align-items: center;
        }

        .hash-value.empty {
            color: var(--text-muted);
            font-style: italic;
        }

        .hash-copy {
            padding: 0.35rem 0.6rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.7rem;
            color: var(--text-muted);
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }

        .hash-copy:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .hash-copy.copied {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        /* Compare Section */
        .compare-section {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }

        .compare-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .compare-input {
            width: 100%;
            font-family: var(--mono);
            font-size: 0.875rem;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            transition: all 0.2s;
        }

        .compare-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .compare-result {
            margin-top: 0.75rem;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            display: none;
        }

        .compare-result.show {
            display: block;
        }

        .compare-result.match {
            background: #dcfce7;
            color: #166534;
        }

        .compare-result.no-match {
            background: #fee2e2;
            color: #991b1b;
        }

        [data-theme="dark"] .compare-result.match {
            background: #14532d;
            color: #86efac;
        }

        [data-theme="dark"] .compare-result.no-match {
            background: #7f1d1d;
            color: #fecaca;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text);
            color: var(--bg);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Shortcuts */
        .shortcuts {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        kbd {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.15rem 0.4rem;
            font-family: var(--mono);
            font-size: 0.7rem;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem 0;
            color: var(--text-muted);
            font-size: 0.875rem;
            border-top: 1px solid var(--border);
            margin-top: 2rem;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Mobile */
        @media (max-width: 640px) {
            .container {
                padding: 1rem;
            }

            h1 {
                font-size: 1.25rem;
            }

            .card {
                padding: 1rem;
                border-radius: 12px;
            }

            .card-header {
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .hash-row {
                flex-wrap: wrap;
                padding: 0.75rem;
            }

            .hash-row:hover {
                transform: none;
            }

            .hash-label {
                min-width: 100%;
                margin-bottom: 0.35rem;
            }

            .hash-value {
                font-size: 0.65rem;
                width: calc(100% - 50px);
            }

            .hash-copy {
                margin-left: auto;
            }

            textarea {
                min-height: 80px;
                font-size: 0.8rem;
            }

            .compare-input {
                font-size: 0.8rem;
            }

            .shortcuts {
                flex-wrap: wrap;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>#️⃣ Hash Generator</h1>

        <!-- Input -->

            <div class="file-zone" id="fileZone" onclick="document.getElementById('fileInput').click()">

                <div class="hash-row">
                    <span class="hash-label">SHA-512</span>

            <!-- Compare -->
            <div class="compare-section">

        <div class="shortcuts">

        <footer>
            <a href="https://aikemist.com">aikemist.com</a> · Made by <a href="https://alkemist.no">Alkemist</a>

    <script>
        // Theme
        function initTheme() {
            const saved = localStorage.getItem('theme');
            if (saved) {
                document.documentElement.dataset.theme = saved;
                updateThemeIcon();
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.dataset.theme = 'dark';
                updateThemeIcon();
            }
        }

        function toggleTheme() {
            const current = document.documentElement.dataset.theme;
            document.documentElement.dataset.theme = current === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', document.documentElement.dataset.theme);
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const btn = document.querySelector('.theme-toggle');
            btn.textContent = document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙';
        }

        // Hash functions using Web Crypto API
        async function hash(algorithm, data) {
            const encoder = new TextEncoder();
            const dataBuffer = typeof data === 'string' ? encoder.encode(data) : data;
            const hashBuffer = await crypto.subtle.digest(algorithm, dataBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // MD5 implementation (not in Web Crypto API)
        function md5(string) {
            function rotateLeft(value, amount) {
                return (value << amount) | (value >>> (32 - amount));
            }
            function addUnsigned(x, y) {
                const x4 = (x & 0x40000000);
                const y4 = (y & 0x40000000);
                const x8 = (x & 0x80000000);
                const y8 = (y & 0x80000000);
                const result = (x & 0x3FFFFFFF) + (y & 0x3FFFFFFF);
                if (x4 & y4) return (result ^ 0x80000000 ^ x8 ^ y8);
                if (x4 | y4) {
                    if (result & 0x40000000) return (result ^ 0xC0000000 ^ x8 ^ y8);
                    else return (result ^ 0x40000000 ^ x8 ^ y8);
                } else return (result ^ x8 ^ y8);
            }
            function F(x, y, z) { return (x & y) | ((~x) & z); }
            function G(x, y, z) { return (x & z) | (y & (~z)); }
            function H(x, y, z) { return (x ^ y ^ z); }
            function I(x, y, z) { return (y ^ (x | (~z))); }
            function FF(a, b, c, d, x, s, ac) {
                a = addUnsigned(a, addUnsigned(addUnsigned(F(b, c, d), x), ac));
                return addUnsigned(rotateLeft(a, s), b);
            }
            function GG(a, b, c, d, x, s, ac) {
                a = addUnsigned(a, addUnsigned(addUnsigned(G(b, c, d), x), ac));
                return addUnsigned(rotateLeft(a, s), b);
            }
            function HH(a, b, c, d, x, s, ac) {
                a = addUnsigned(a, addUnsigned(addUnsigned(H(b, c, d), x), ac));
                return addUnsigned(rotateLeft(a, s), b);
            }
            function II(a, b, c, d, x, s, ac) {
                a = addUnsigned(a, addUnsigned(addUnsigned(I(b, c, d), x), ac));
                return addUnsigned(rotateLeft(a, s), b);
            }
            function convertToWordArray(string) {
                let messageLength = string.length;
                let numberOfWordsTemp1 = messageLength + 8;
                let numberOfWordsTemp2 = (numberOfWordsTemp1 - (numberOfWordsTemp1 % 64)) / 64;
                let numberOfWords = (numberOfWordsTemp2 + 1) * 16;
                let wordArray = Array(numberOfWords - 1);
                let bytePosition = 0;
                let byteCount = 0;
                while (byteCount < messageLength) {
                    let wordCount = (byteCount - (byteCount % 4)) / 4;
                    bytePosition = (byteCount % 4) * 8;
                    wordArray[wordCount] = (wordArray[wordCount] | (string.charCodeAt(byteCount) << bytePosition));
                    byteCount++;
                }
                let wordCount = (byteCount - (byteCount % 4)) / 4;
                bytePosition = (byteCount % 4) * 8;
                wordArray[wordCount] = wordArray[wordCount] | (0x80 << bytePosition);
                wordArray[numberOfWords - 2] = messageLength << 3;
                wordArray[numberOfWords - 1] = messageLength >>> 29;
                return wordArray;
            }
            function wordToHex(value) {
                let hex = "", temp, byte;
                for (byte = 0; byte <= 3; byte++) {
                    temp = (value >>> (byte * 8)) & 255;
                    hex += ("0" + temp.toString(16)).slice(-2);
                }
                return hex;
            }
            
            const S11 = 7, S12 = 12, S13 = 17, S14 = 22;
            const S21 = 5, S22 = 9, S23 = 14, S24 = 20;
            const S31 = 4, S32 = 11, S33 = 16, S34 = 23;
            const S41 = 6, S42 = 10, S43 = 15, S44 = 21;
            
            const utf8String = unescape(encodeURIComponent(string));
            const x = convertToWordArray(utf8String);
            let a = 0x67452301, b = 0xEFCDAB89, c = 0x98BADCFE, d = 0x10325476;
            
            for (let k = 0; k < x.length; k += 16) {
                const AA = a, BB = b, CC = c, DD = d;
                a = FF(a, b, c, d, x[k + 0], S11, 0xD76AA478);
                d = FF(d, a, b, c, x[k + 1], S12, 0xE8C7B756);
                c = FF(c, d, a, b, x[k + 2], S13, 0x242070DB);
                b = FF(b, c, d, a, x[k + 3], S14, 0xC1BDCEEE);
                a = FF(a, b, c, d, x[k + 4], S11, 0xF57C0FAF);
                d = FF(d, a, b, c, x[k + 5], S12, 0x4787C62A);
                c = FF(c, d, a, b, x[k + 6], S13, 0xA8304613);
                b = FF(b, c, d, a, x[k + 7], S14, 0xFD469501);
                a = FF(a, b, c, d, x[k + 8], S11, 0x698098D8);
                d = FF(d, a, b, c, x[k + 9], S12, 0x8B44F7AF);
                c = FF(c, d, a, b, x[k + 10], S13, 0xFFFF5BB1);
                b = FF(b, c, d, a, x[k + 11], S14, 0x895CD7BE);
                a = FF(a, b, c, d, x[k + 12], S11, 0x6B901122);
                d = FF(d, a, b, c, x[k + 13], S12, 0xFD987193);
                c = FF(c, d, a, b, x[k + 14], S13, 0xA679438E);
                b = FF(b, c, d, a, x[k + 15], S14, 0x49B40821);
                a = GG(a, b, c, d, x[k + 1], S21, 0xF61E2562);
                d = GG(d, a, b, c, x[k + 6], S22, 0xC040B340);
                c = GG(c, d, a, b, x[k + 11], S23, 0x265E5A51);
                b = GG(b, c, d, a, x[k + 0], S24, 0xE9B6C7AA);
                a = GG(a, b, c, d, x[k + 5], S21, 0xD62F105D);
                d = GG(d, a, b, c, x[k + 10], S22, 0x02441453);
                c = GG(c, d, a, b, x[k + 15], S23, 0xD8A1E681);
                b = GG(b, c, d, a, x[k + 4], S24, 0xE7D3FBC8);
                a = GG(a, b, c, d, x[k + 9], S21, 0x21E1CDE6);
                d = GG(d, a, b, c, x[k + 14], S22, 0xC33707D6);
                c = GG(c, d, a, b, x[k + 3], S23, 0xF4D50D87);
                b = GG(b, c, d, a, x[k + 8], S24, 0x455A14ED);
                a = GG(a, b, c, d, x[k + 13], S21, 0xA9E3E905);
                d = GG(d, a, b, c, x[k + 2], S22, 0xFCEFA3F8);
                c = GG(c, d, a, b, x[k + 7], S23, 0x676F02D9);
                b = GG(b, c, d, a, x[k + 12], S24, 0x8D2A4C8A);
                a = HH(a, b, c, d, x[k + 5], S31, 0xFFFA3942);
                d = HH(d, a, b, c, x[k + 8], S32, 0x8771F681);
                c = HH(c, d, a, b, x[k + 11], S33, 0x6D9D6122);
                b = HH(b, c, d, a, x[k + 14], S34, 0xFDE5380C);
                a = HH(a, b, c, d, x[k + 1], S31, 0xA4BEEA44);
                d = HH(d, a, b, c, x[k + 4], S32, 0x4BDECFA9);
                c = HH(c, d, a, b, x[k + 7], S33, 0xF6BB4B60);
                b = HH(b, c, d, a, x[k + 10], S34, 0xBEBFBC70);
                a = HH(a, b, c, d, x[k + 13], S31, 0x289B7EC6);
                d = HH(d, a, b, c, x[k + 0], S32, 0xEAA127FA);
                c = HH(c, d, a, b, x[k + 3], S33, 0xD4EF3085);
                b = HH(b, c, d, a, x[k + 6], S34, 0x04881D05);
                a = HH(a, b, c, d, x[k + 9], S31, 0xD9D4D039);
                d = HH(d, a, b, c, x[k + 12], S32, 0xE6DB99E5);
                c = HH(c, d, a, b, x[k + 15], S33, 0x1FA27CF8);
                b = HH(b, c, d, a, x[k + 2], S34, 0xC4AC5665);
                a = II(a, b, c, d, x[k + 0], S41, 0xF4292244);
                d = II(d, a, b, c, x[k + 7], S42, 0x432AFF97);
                c = II(c, d, a, b, x[k + 14], S43, 0xAB9423A7);
                b = II(b, c, d, a, x[k + 5], S44, 0xFC93A039);
                a = II(a, b, c, d, x[k + 12], S41, 0x655B59C3);
                d = II(d, a, b, c, x[k + 3], S42, 0x8F0CCC92);
                c = II(c, d, a, b, x[k + 10], S43, 0xFFEFF47D);
                b = II(b, c, d, a, x[k + 1], S44, 0x85845DD1);
                a = II(a, b, c, d, x[k + 8], S41, 0x6FA87E4F);
                d = II(d, a, b, c, x[k + 15], S42, 0xFE2CE6E0);
                c = II(c, d, a, b, x[k + 6], S43, 0xA3014314);
                b = II(b, c, d, a, x[k + 13], S44, 0x4E0811A1);
                a = II(a, b, c, d, x[k + 4], S41, 0xF7537E82);
                d = II(d, a, b, c, x[k + 11], S42, 0xBD3AF235);
                c = II(c, d, a, b, x[k + 2], S43, 0x2AD7D2BB);
                b = II(b, c, d, a, x[k + 9], S44, 0xEB86D391);
                a = addUnsigned(a, AA);
                b = addUnsigned(b, BB);
                c = addUnsigned(c, CC);
                d = addUnsigned(d, DD);
            }
            return (wordToHex(a) + wordToHex(b) + wordToHex(c) + wordToHex(d)).toLowerCase();
        }

        let currentHashes = { md5: '', sha1: '', sha256: '', sha512: '' };

        async function generateHashes() {
            const input = document.getElementById('input').value;
            
            if (!input) {
                setEmpty();
                return;
            }

            // Generate all hashes
            currentHashes.md5 = md5(input);
            currentHashes.sha1 = await hash('SHA-1', input);
            currentHashes.sha256 = await hash('SHA-256', input);
            currentHashes.sha512 = await hash('SHA-512', input);

            // Update UI
            document.getElementById('md5').textContent = currentHashes.md5;
            document.getElementById('md5').classList.remove('empty');
            document.getElementById('sha1').textContent = currentHashes.sha1;
            document.getElementById('sha1').classList.remove('empty');
            document.getElementById('sha256').textContent = currentHashes.sha256;
            document.getElementById('sha256').classList.remove('empty');
            document.getElementById('sha512').textContent = currentHashes.sha512;
            document.getElementById('sha512').classList.remove('empty');

            compareHash();
        }

        function setEmpty() {
            currentHashes = { md5: '', sha1: '', sha256: '', sha512: '' };
            document.getElementById('md5').textContent = 'Enter text or upload a file';
            document.getElementById('md5').classList.add('empty');
            document.getElementById('sha1').textContent = '—';
            document.getElementById('sha1').classList.add('empty');
            document.getElementById('sha256').textContent = '—';
            document.getElementById('sha256').classList.add('empty');
            document.getElementById('sha512').textContent = '—';
            document.getElementById('sha512').classList.add('empty');
            document.getElementById('compareResult').classList.remove('show');
        }

        // File handling
        const fileZone = document.getElementById('fileZone');
        
        fileZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileZone.classList.add('dragover');
        });

        fileZone.addEventListener('dragleave', () => {
            fileZone.classList.remove('dragover');
        });

        fileZone.addEventListener('drop', (e) => {
            e.preventDefault();
            fileZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        async function handleFile(file) {
            if (!file) return;
            
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileName').classList.add('show');
            document.getElementById('input').value = `[Hashing file: ${file.name}]`;
            document.getElementById('input').disabled = true;

            const buffer = await file.arrayBuffer();
            const uint8Array = new Uint8Array(buffer);
            
            // For MD5, convert to string (limited approach for demo)
            let str = '';
            for (let i = 0; i < uint8Array.length; i++) {
                str += String.fromCharCode(uint8Array[i]);
            }
            
            currentHashes.md5 = md5(str);
            currentHashes.sha1 = await hash('SHA-1', uint8Array);
            currentHashes.sha256 = await hash('SHA-256', uint8Array);
            currentHashes.sha512 = await hash('SHA-512', uint8Array);

            document.getElementById('md5').textContent = currentHashes.md5;
            document.getElementById('md5').classList.remove('empty');
            document.getElementById('sha1').textContent = currentHashes.sha1;
            document.getElementById('sha1').classList.remove('empty');
            document.getElementById('sha256').textContent = currentHashes.sha256;
            document.getElementById('sha256').classList.remove('empty');
            document.getElementById('sha512').textContent = currentHashes.sha512;
            document.getElementById('sha512').classList.remove('empty');

            showToast(`Hashed: ${file.name}`);
            compareHash();
        }

        // Compare
        function compareHash() {
            const compare = document.getElementById('compareInput').value.trim().toLowerCase();
            const result = document.getElementById('compareResult');
            
            if (!compare) {
                result.classList.remove('show');
                return;
            }

            const hashes = Object.values(currentHashes).filter(h => h);
            if (!hashes.length) {
                result.classList.remove('show');
                return;
            }

            const match = hashes.find(h => h === compare);
            
            if (match) {
                const algo = Object.keys(currentHashes).find(k => currentHashes[k] === compare);
                result.textContent = `✓ Match found: ${algo.toUpperCase()}`;
                result.className = 'compare-result show match';
            } else {
                result.textContent = '✗ No match';
                result.className = 'compare-result show no-match';
            }
        }

        // Actions
        function clearInput() {
            document.getElementById('input').value = '';
            document.getElementById('input').disabled = false;
            document.getElementById('fileName').classList.remove('show');
            document.getElementById('compareInput').value = '';
            setEmpty();
        }

        async function pasteInput() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('input').value = text;
                document.getElementById('input').disabled = false;
                document.getElementById('fileName').classList.remove('show');
                generateHashes();
                showToast('Pasted from clipboard');
            } catch (e) {
                showToast('Could not access clipboard');
            }
        }

        function copyHash(algo) {
            const value = currentHashes[algo];
            if (!value) {
                showToast('Nothing to copy');
                return;
            }
            navigator.clipboard.writeText(value);
            
            const btn = event.target;
            btn.classList.add('copied');
            btn.textContent = '✓';
            setTimeout(() => {
                btn.classList.remove('copied');
                btn.textContent = 'Copy';
            }, 1500);
        }

        function copyAll() {
            if (!currentHashes.md5) {
                showToast('Nothing to copy');
                return;
            }
            const all = `MD5: ${currentHashes.md5}\nSHA-1: ${currentHashes.sha1}\nSHA-256: ${currentHashes.sha256}\nSHA-512: ${currentHashes.sha512}`;
            navigator.clipboard.writeText(all);
            showToast('All hashes copied');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
            
            switch(e.key.toLowerCase()) {
                case 'c':
                    copyAll();
                    break;
                case 'x':
                    clearInput();
                    break;
                case 't':
                    toggleTheme();
                    break;
            }
        });

        // Init
        initTheme();
    </script>
</body>
</html>
