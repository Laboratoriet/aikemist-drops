<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Unit badges -->
  <g transform="translate(700, 200)">
    <rect x="0" y="0" width="80" height="40" rx="8" fill="#6366f1"/>
    <text x="40" y="26" font-family="monospace" font-size="18" font-weight="600" fill="white" text-anchor="middle">px</text>
    
    <rect x="100" y="0" width="80" height="40" rx="8" fill="#8b5cf6"/>
    <text x="140" y="26" font-family="monospace" font-size="18" font-weight="600" fill="white" text-anchor="middle">rem</text>
    
    <rect x="200" y="0" width="80" height="40" rx="8" fill="#a855f7"/>
    <text x="240" y="26" font-family="monospace" font-size="18" font-weight="600" fill="white" text-anchor="middle">em</text>
    
    <rect x="300" y="0" width="80" height="40" rx="8" fill="#ec4899"/>
    <text x="340" y="26" font-family="monospace" font-size="18" font-weight="600" fill="white" text-anchor="middle">vw</text>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(700, 280)">
    <path d="M0 20 L380 20" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <path d="M370 10 L390 20 L370 30" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  </g>
  
  <!-- Content -->
  <text x="100" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="white">CSS Unit Converter</text>
  <text x="100" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="rgba(255,255,255,0.7)">px • rem • em • pt • % • vw • vh</text>
  
  <!-- Logo -->
  <g transform="translate(100, 480)">
    <rect width="48" height="48" rx="10" fill="white"/>
    <path d="M14 34L24 14L34 34" stroke="#6366f1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="24" cy="28" r="3" fill="#6366f1"/>
  </g>
  <text x="160" y="515" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="white">Alkemist</text>
  
  <!-- URL -->
  <text x="1100" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="rgba(255,255,255,0.5)" text-anchor="end">day037.aikemist.com</text>
</svg>
