<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Border Generator — Alkemist</title>
  <meta name="description" content="Create stunning CSS gradient borders. Visual editor, multiple techniques, copy-paste code. Free tool by Alkemist.">
  <meta property="og:title" content="Gradient Border Generator — Alkemist">
  <meta property="og:description" content="Create stunning CSS gradient borders visually. Free design tool.">
  <meta property="og:image" content="https://day012.aikemist.com/og.png">
  <meta property="og:url" content="https://day012.aikemist.com">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔲</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-hover: #1a1a1a;
      --border: #2a2a2a;
      --text: #fafafa;
      --text-muted: #888;
      --accent: #fff;
      --radius: 12px;
    }
    
    [data-theme="light"] {
      --bg: #fafafa;
      --surface: #fff;
      --surface-hover: #f5f5f5;
      --border: #e5e5e5;
      --text: #0a0a0a;
      --text-muted: #666;
      --accent: #0a0a0a;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Jost', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }
    
    header {
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text);
    }
    
    .logo-mark {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #ff6b6b, #4ecdc4, #45b7d1, #96e6a1);
      border-radius: 8px;
    }
    
    .logo-text {
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
    }
    
    .header-actions {
      display: flex;
      gap: 0.5rem;
    }
    
        .theme-toggle {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, background 0.2s ease;
      overflow: hidden;
    }
    
    [data-theme="dark"] .theme-toggle {
      background: rgba(0, 0, 0, 0.2);
      border-color: rgba(255, 255, 255, 0.1);
    }
    
    .theme-toggle:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.2);
    }
    
    [data-theme="dark"] .theme-toggle:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    
    .theme-toggle:active {
      transform: scale(0.95);
    }
    
    .theme-toggle-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .theme-toggle-icon svg {
      width: 20px;
      height: 20px;
    }
    
    .theme-toggle-icon .sun-icon {
      color: #facc15;
    }
    
    .theme-toggle-icon .moon-icon {
      color: #64748b;
    }
    
    [data-theme="dark"] .theme-toggle-icon {
      transform: rotate(180deg);
    }
    
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }
    
    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }
    
    .subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }
    
    .app {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 2rem;
    }
    
    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
      }
    }
    
    .preview-area {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 450px;
      position: relative;
    }
    
    .preview-bg-toggle {
      position: absolute;
      top: 1rem;
      right: 1rem;
      display: flex;
      gap: 0.25rem;
    }
    
    .bg-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 2px solid var(--border);
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .bg-btn:hover, .bg-btn.active {
      border-color: var(--text);
    }
    
    .bg-btn.light { background: #fff; }
    .bg-btn.dark { background: #0a0a0a; }
    .bg-btn.gradient { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .bg-btn.checker { background: repeating-conic-gradient(#ccc 0% 25%, #fff 0% 50%) 50% / 16px 16px; }
    
    .preview-element {
      transition: all 0.3s ease;
    }
    
    .controls {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    
    .control-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
    }
    
    .control-section h3 {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
    
    .presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    
    .preset {
      aspect-ratio: 1;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    
    .preset::before {
      content: '';
      position: absolute;
      inset: 3px;
      background: var(--surface);
      border-radius: 5px;
    }
    
    .preset:hover, .preset.active {
      border-color: var(--text);
      transform: scale(1.05);
    }
    
    .preset-sunset { background: linear-gradient(135deg, #f093fb, #f5576c); }
    .preset-ocean { background: linear-gradient(135deg, #4facfe, #00f2fe); }
    .preset-mint { background: linear-gradient(135deg, #11998e, #38ef7d); }
    .preset-fire { background: linear-gradient(135deg, #f12711, #f5af19); }
    .preset-purple { background: linear-gradient(135deg, #667eea, #764ba2); }
    .preset-sky { background: linear-gradient(135deg, #a8edea, #fed6e3); }
    .preset-neon { background: linear-gradient(135deg, #ff00ff, #00ffff); }
    .preset-gold { background: linear-gradient(135deg, #f7971e, #ffd200); }
    
    .gradient-stops {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    
    .gradient-stop {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    
    .color-input-wrap {
      position: relative;
      width: 40px;
      height: 40px;
    }
    
    .color-input {
      position: absolute;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      padding: 0;
    }
    
    .color-input::-webkit-color-swatch-wrapper { padding: 0; }
    .color-input::-webkit-color-swatch { border: none; border-radius: 8px; }
    
    .hex-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 0.75rem;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.9rem;
    }
    
    .hex-input:focus {
      outline: none;
      border-color: var(--text-muted);
    }
    
    .control-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    
    .control-row:last-child {
      margin-bottom: 0;
    }
    
    .control-label {
      font-size: 0.9rem;
      min-width: 80px;
    }
    
    .control-value {
      font-size: 0.85rem;
      color: var(--text-muted);
      min-width: 50px;
      text-align: right;
    }
    
    input[type="range"] {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      background: var(--border);
      border-radius: 3px;
      cursor: pointer;
    }
    
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: var(--text);
      border-radius: 50%;
      cursor: pointer;
    }
    
    select {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 0.75rem;
      border-radius: 8px;
      font-family: 'Jost', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
    }
    
    select:focus {
      outline: none;
      border-color: var(--text-muted);
    }
    
    .shape-buttons {
      display: flex;
      gap: 0.5rem;
    }
    
    .shape-btn {
      flex: 1;
      padding: 0.6rem;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Jost', sans-serif;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    
    .shape-btn:hover {
      background: var(--surface-hover);
    }
    
    .shape-btn.active {
      background: var(--text);
      color: var(--bg);
    }
    
    .code-output {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    
    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    
    .code-header h3 {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }
    
    .copy-btn {
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-family: 'Jost', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .copy-btn:hover {
      opacity: 0.9;
    }
    
    .copy-btn.copied {
      background: #10b981;
      color: white;
    }
    
    .code-content {
      padding: 1rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.8rem;
      line-height: 1.7;
      color: var(--text-muted);
      overflow-x: auto;
      white-space: pre-wrap;
      max-height: 200px;
      overflow-y: auto;
    }
    
    .code-content .property {
      color: #4ecdc4;
    }
    
    .code-content .value {
      color: #f093fb;
    }
    
    footer {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      border-top: 1px solid var(--border);
      margin-top: 4rem;
    }
    
    footer a {
      color: var(--text);
      text-decoration: none;
    }
    
    footer a:hover {
      text-decoration: underline;
    }
    
    .pro-teaser {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
      border: 1px solid rgba(102, 126, 234, 0.3);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-top: 1.5rem;
    }
    
    .pro-teaser h4 {
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .pro-teaser ul {
      font-size: 0.85rem;
      color: var(--text-muted);
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
    }
    
    .pro-teaser li::before {
      content: '→ ';
      color: #667eea;
    }
    
    .share-btn {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      color: white;
      border-radius: var(--radius);
      font-family: 'Jost', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .share-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
    }
    
    .share-btn.copied {
      background: linear-gradient(135deg, #10b981, #059669);
    }
    
    @media (max-width: 900px) {
      main {
        padding: 1.5rem;
      }
      
      .preview-area {
        min-height: 300px;
        padding: 2rem;
      }
      
      .presets {
        grid-template-columns: repeat(4, 1fr);
      }
      
      h1 {
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="https://aikemist.com" class="logo">
      <div class="logo-mark"></div>
      <span class="logo-text">Alkemist</span>
    </a>
    <div class="header-actions">
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">
        <div class="theme-toggle-icon">
          <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
          <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </div>
      </button>
    </div>
  </header>

  <main>
    <h1>Gradient Border Generator</h1>
    <p class="subtitle">Create stunning CSS gradient borders. No hacks, just clean code.</p>

    <div class="app">
      <div class="preview-area" id="previewArea">
        <div class="preview-bg-toggle">
          <button class="bg-btn light active" onclick="setBg('light')"></button>
          <button class="bg-btn dark" onclick="setBg('dark')"></button>
          <button class="bg-btn gradient" onclick="setBg('gradient')"></button>
          <button class="bg-btn checker" onclick="setBg('checker')"></button>
        </div>
        <div class="preview-element" id="previewElement"></div>
      </div>

      <div class="controls">
        <div class="control-section">
          <h3>Gradient Presets</h3>
          <div class="presets">
            <div class="preset preset-sunset active" data-colors="#f093fb,#f5576c" onclick="applyPreset(this)"></div>
            <div class="preset preset-ocean" data-colors="#4facfe,#00f2fe" onclick="applyPreset(this)"></div>
            <div class="preset preset-mint" data-colors="#11998e,#38ef7d" onclick="applyPreset(this)"></div>
            <div class="preset preset-fire" data-colors="#f12711,#f5af19" onclick="applyPreset(this)"></div>
            <div class="preset preset-purple" data-colors="#667eea,#764ba2" onclick="applyPreset(this)"></div>
            <div class="preset preset-sky" data-colors="#a8edea,#fed6e3" onclick="applyPreset(this)"></div>
            <div class="preset preset-neon" data-colors="#ff00ff,#00ffff" onclick="applyPreset(this)"></div>
            <div class="preset preset-gold" data-colors="#f7971e,#ffd200" onclick="applyPreset(this)"></div>
          </div>
          <div class="gradient-stops">
            <div class="gradient-stop">
              <div class="color-input-wrap">
                <input type="color" class="color-input" id="color1" value="#f093fb" onchange="updateGradient()">
              </div>
              <input type="text" class="hex-input" id="hex1" value="#f093fb" onchange="syncFromHex(1)">
            </div>
            <div class="gradient-stop">
              <div class="color-input-wrap">
                <input type="color" class="color-input" id="color2" value="#f5576c" onchange="updateGradient()">
              </div>
              <input type="text" class="hex-input" id="hex2" value="#f5576c" onchange="syncFromHex(2)">
            </div>
          </div>
        </div>

        <div class="control-section">
          <h3>Shape</h3>
          <div class="shape-buttons">
            <button class="shape-btn active" data-shape="button" onclick="setShape('button')">Button</button>
            <button class="shape-btn" data-shape="card" onclick="setShape('card')">Card</button>
            <button class="shape-btn" data-shape="circle" onclick="setShape('circle')">Circle</button>
          </div>
        </div>

        <div class="control-section">
          <h3>Settings</h3>
          <div class="control-row">
            <span class="control-label">Border Width</span>
            <input type="range" id="borderWidth" min="1" max="8" value="2" onchange="updateGradient()" oninput="updateGradient()">
            <span class="control-value" id="borderWidthVal">2px</span>
          </div>
          <div class="control-row">
            <span class="control-label">Border Radius</span>
            <input type="range" id="borderRadius" min="0" max="50" value="12" onchange="updateGradient()" oninput="updateGradient()">
            <span class="control-value" id="borderRadiusVal">12px</span>
          </div>
          <div class="control-row">
            <span class="control-label">Angle</span>
            <input type="range" id="angle" min="0" max="360" value="135" onchange="updateGradient()" oninput="updateGradient()">
            <span class="control-value" id="angleVal">135°</span>
          </div>
          <div class="control-row">
            <span class="control-label">Fill</span>
            <select id="fillType" onchange="updateGradient()">
              <option value="solid">Solid Color</option>
              <option value="transparent">Transparent</option>
              <option value="gradient">Match Gradient</option>
            </select>
          </div>
        </div>

        <div class="code-output">
          <div class="code-header">
            <h3>CSS Code</h3>
            <button class="copy-btn" onclick="copyCode()">Copy CSS</button>
          </div>
          <div class="code-content" id="codeOutput"></div>
        </div>

        <button class="share-btn" onclick="shareUrl()">🔗 Share This Gradient</button>

      </div>
    </div>
  </main>

  <footer>
    <a href="https://aikemist.com">aikemist.com</a> · Made by <a href="https://alkemist.no">Alkemist</a>
  </footer>

  <script>
    let state = {
      color1: '#f093fb',
      color2: '#f5576c',
      borderWidth: 2,
      borderRadius: 12,
      angle: 135,
      shape: 'button',
      fillType: 'solid',
      bgType: 'light'
    };

    function updateGradient() {
      state.color1 = document.getElementById('color1').value;
      state.color2 = document.getElementById('color2').value;
      state.borderWidth = parseInt(document.getElementById('borderWidth').value);
      state.borderRadius = parseInt(document.getElementById('borderRadius').value);
      state.angle = parseInt(document.getElementById('angle').value);
      state.fillType = document.getElementById('fillType').value;

      document.getElementById('hex1').value = state.color1;
      document.getElementById('hex2').value = state.color2;
      document.getElementById('borderWidthVal').textContent = state.borderWidth + 'px';
      document.getElementById('borderRadiusVal').textContent = state.borderRadius + 'px';
      document.getElementById('angleVal').textContent = state.angle + '°';

      renderPreview();
      generateCode();
    }

    function syncFromHex(num) {
      const hex = document.getElementById('hex' + num).value;
      if (/^#[0-9A-Fa-f]{6}$/.test(hex)) {
        document.getElementById('color' + num).value = hex;
        updateGradient();
      }
    }

    function applyPreset(el) {
      document.querySelectorAll('.preset').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      const [c1, c2] = el.dataset.colors.split(',');
      document.getElementById('color1').value = c1;
      document.getElementById('color2').value = c2;
      updateGradient();
    }

    function setShape(shape) {
      state.shape = shape;
      document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`.shape-btn[data-shape="${shape}"]`).classList.add('active');
      
      // Adjust radius for circle
      if (shape === 'circle') {
        document.getElementById('borderRadius').value = 50;
      } else if (shape === 'button') {
        document.getElementById('borderRadius').value = 12;
      } else {
        document.getElementById('borderRadius').value = 16;
      }
      
      updateGradient();
    }

    function setBg(type) {
      state.bgType = type;
      document.querySelectorAll('.bg-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`.bg-btn.${type}`).classList.add('active');
      
      const area = document.getElementById('previewArea');
      area.style.background = '';
      
      switch(type) {
        case 'light': area.style.background = '#fff'; break;
        case 'dark': area.style.background = '#0a0a0a'; break;
        case 'gradient': area.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)'; break;
        case 'checker': area.style.background = 'repeating-conic-gradient(#ccc 0% 25%, #fff 0% 50%) 50% / 16px 16px'; break;
      }
    }

    function renderPreview() {
      const el = document.getElementById('previewElement');
      const gradient = `linear-gradient(${state.angle}deg, ${state.color1}, ${state.color2})`;
      
      let width, height, content = '';
      switch(state.shape) {
        case 'button':
          width = '180px';
          height = '52px';
          content = '<span style="font-weight:500;letter-spacing:-0.01em">Get Started</span>';
          break;
        case 'card':
          width = '280px';
          height = '180px';
          content = '<span style="font-size:0.9rem;color:#888">Card Content</span>';
          break;
        case 'circle':
          width = '120px';
          height = '120px';
          break;
      }

      let bgStyle = '';
      switch(state.fillType) {
        case 'solid':
          bgStyle = state.bgType === 'dark' ? '#0a0a0a' : '#fff';
          break;
        case 'transparent':
          bgStyle = 'transparent';
          break;
        case 'gradient':
          bgStyle = gradient;
          break;
      }

      const radius = state.shape === 'circle' ? '50%' : state.borderRadius + 'px';

      el.style.cssText = `
        width: ${width};
        height: ${height};
        border-radius: ${radius};
        background: ${bgStyle};
        border: ${state.borderWidth}px solid transparent;
        background-image: linear-gradient(${bgStyle}, ${bgStyle}), ${gradient};
        background-origin: border-box;
        background-clip: padding-box, border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        color: ${state.fillType === 'gradient' ? '#fff' : (state.bgType === 'dark' ? '#fff' : '#0a0a0a')};
        font-size: 1rem;
      `;
      
      el.innerHTML = content;
    }

    function generateCode() {
      const gradient = `linear-gradient(${state.angle}deg, ${state.color1}, ${state.color2})`;
      const radius = state.shape === 'circle' ? '50%' : state.borderRadius + 'px';
      
      let bgColor = '#ffffff';
      switch(state.fillType) {
        case 'solid': bgColor = '#ffffff'; break;
        case 'transparent': bgColor = 'transparent'; break;
        case 'gradient': bgColor = gradient; break;
      }

      const fillBg = bgColor === gradient ? gradient : `linear-gradient(${bgColor}, ${bgColor})`;

      let css = `/* Gradient Border — ${state.shape} */
.gradient-border {
  border: ${state.borderWidth}px solid transparent;
  border-radius: ${radius};
  background: 
    ${fillBg},
    ${gradient};
  background-origin: border-box;
  background-clip: padding-box, border-box;
}`;

      document.getElementById('codeOutput').textContent = css;
    }

    function copyCode() {
      const code = document.getElementById('codeOutput').textContent;
      navigator.clipboard.writeText(code);
      
      const btn = document.querySelector('.copy-btn');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      
      setTimeout(() => {
        btn.textContent = 'Copy CSS';
        btn.classList.remove('copied');
      }, 2000);
    }

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.dataset.theme !== 'light';
      html.dataset.theme = isDark ? 'light' : 'dark';
      document.querySelector('.theme-toggle').textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('theme', html.dataset.theme);
    }

    function shareUrl() {
      const params = new URLSearchParams({
        c1: state.color1.replace('#', ''),
        c2: state.color2.replace('#', ''),
        w: state.borderWidth,
        r: state.borderRadius,
        a: state.angle,
        s: state.shape,
        f: state.fillType
      });
      
      const url = window.location.origin + '?' + params.toString();
      navigator.clipboard.writeText(url);
      
      const btn = document.querySelector('.share-btn');
      btn.textContent = '✓ Link Copied!';
      btn.classList.add('copied');
      
      setTimeout(() => {
        btn.textContent = '🔗 Share This Gradient';
        btn.classList.remove('copied');
      }, 2000);
    }

    function loadFromUrl() {
      const params = new URLSearchParams(window.location.search);
      if (params.has('c1')) {
        document.getElementById('color1').value = '#' + params.get('c1');
        document.getElementById('color2').value = '#' + params.get('c2');
        document.getElementById('borderWidth').value = params.get('w') || 2;
        document.getElementById('borderRadius').value = params.get('r') || 12;
        document.getElementById('angle').value = params.get('a') || 135;
        document.getElementById('fillType').value = params.get('f') || 'solid';
        
        const shape = params.get('s') || 'button';
        state.shape = shape;
        document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.shape-btn[data-shape="${shape}"]`).classList.add('active');
        
        // Clear preset selection when loading custom
        document.querySelectorAll('.preset').forEach(p => p.classList.remove('active'));
      }
    }

    // Init
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
      document.documentElement.dataset.theme = 'light';
      document.querySelector('.theme-toggle').textContent = '☀️';
    }

    loadFromUrl();
    updateGradient();
    setBg('light');
  </script>
</body>
</html>
