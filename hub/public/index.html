<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aikemist — Daily AI Experiments</title>
    <meta name="description" content="One AI project. Every day. Daily experiments from a design studio exploring the frontier of artificial intelligence.">
    
    <!-- Open Graph -->
    <meta property="og:title" content="aikemist — Daily AI Experiments">
    <meta property="og:description" content="One AI project. Every day.">
    <meta property="og:image" content="/og-image.png">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://aikemist.com">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="aikemist — Daily AI Experiments">
    <meta name="twitter:description" content="One AI project. Every day.">
    <meta name="twitter:image" content="/og-image.png">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚗️</text></svg>">
    
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg: #0a0a0a;
            --bg-elevated: #111111;
            --bg-card: #161616;
            --text: #fafafa;
            --text-muted: #737373;
            --accent: #e5e5e5;
            --border: #262626;
            --radius: 12px;
        }
        
        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        body {
            font-family: 'Jost', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }
        
        /* Hero */
        .hero {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 120px 0 80px;
        }
        
        .logo {
            font-size: clamp(3.5rem, 12vw, 8rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1;
            margin-bottom: 24px;
        }
        
        .logo span {
            color: var(--text-muted);
            font-weight: 300;
        }
        
        .tagline {
            font-size: clamp(1.25rem, 3vw, 1.75rem);
            color: var(--text-muted);
            font-weight: 400;
            max-width: 500px;
        }
        
        .day-counter {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 48px;
            padding: 12px 20px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 100px;
            font-size: 0.875rem;
            color: var(--text-muted);
        }
        
        .day-counter .pulse {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        /* Section */
        .section {
            padding: 80px 0;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 48px;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .section-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }
        
        /* Project Grid */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
        }
        
        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        
        .project-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        
        .project-card:hover {
            border-color: #404040;
            transform: translateY(-2px);
        }
        
        .project-card:hover::before {
            opacity: 1;
        }
        
        .project-day {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
        }
        
        .project-name {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        
        .project-desc {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.5;
        }
        
        .project-arrow {
            margin-top: auto;
            padding-top: 16px;
            color: var(--text-muted);
            font-size: 1.25rem;
            transition: transform 0.2s ease, color 0.2s ease;
        }
        
        .project-card:hover .project-arrow {
            transform: translateX(4px);
            color: var(--text);
        }
        
        /* Empty State */
        .coming-soon {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 24px;
            color: var(--text-muted);
            border: 1px dashed var(--border);
            border-radius: var(--radius);
        }
        
        .coming-soon-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }
        
        /* Footer */
        footer {
            padding: 48px 0;
            border-top: 1px solid var(--border);
            margin-top: 80px;
        }
        
        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 24px;
        }
        
        .footer-brand {
            font-size: 0.875rem;
            color: var(--text-muted);
        }
        
        .footer-brand a {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s ease;
        }
        
        .footer-brand a:hover {
            opacity: 0.7;
        }
        
        .footer-year {
            font-size: 0.875rem;
            color: var(--text-muted);
        }
        
        /* Mobile */
        @media (max-width: 640px) {
            .hero {
                min-height: 60vh;
                padding: 80px 0 60px;
            }
            
            .projects-grid {
                grid-template-columns: 1fr;
            }
            
            .project-card {
                padding: 24px;
            }
            
            .section {
                padding: 60px 0;
            }
        }
    </style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800</head>display=swap" rel="stylesheet"></head>
<body>
    <main>
        <section class="hero">
            <div class="container">
                <h1 class="logo">aikemist</h1>
                <p class="tagline">One AI project. Every day.</p>
                <div class="day-counter">
                    <span class="pulse"></span>
                    <span>Day 001 — Shipping daily</span>
                </div>
            </div>
        </section>
        
        <section class="section">
            <div class="container">
                <div class="section-header">
                    <h2 class="section-title">Experiments</h2>
                </div>
                
                <div class="projects-grid">
                    <a href="https://day001.aikemist.com" class="project-card">
                        <span class="project-day">Day 001</span>
                        <h3 class="project-name">Color Palette Generator</h3>
                        <p class="project-desc">AI-powered color harmonies. Generate beautiful palettes from a single hue.</p>
                        <span class="project-arrow">→</span>
                    </a>
                    
                    <!-- More projects will be added here -->
                    
                </div>
            </div>
        </section>
    </main>
    
    <footer>
        <div class="container">
            <div class="footer-content">
                <p class="footer-brand">
                    A project by <a href="https://alkemist.no" target="_blank" rel="noopener">Alkemist</a>
                </p>
                <p class="footer-year">2026</p>
            </div>
        </div>
    </footer>
</body>
</html>
