<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placeholder Image Generator — Custom Placeholders | Aikemist</title>
    <meta name="description" content="Generate placeholder images with custom dimensions, colors, and text. Download or copy the URL for use in mockups and prototypes.">
    <meta property="og:title" content="Placeholder Image Generator — Aikemist">
    <meta property="og:description" content="Generate custom placeholder images instantly.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://day065.aikemist.com">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖼️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --bg: #fafafa;
            --surface: #ffffff;
            --surface-alt: #f5f5f5;
            --text: #1a1a1a;
            --text-muted: #666666;
            --border: #e5e5e5;
            --primary: #2563eb;
            --primary-light: rgba(37, 99, 235, 0.1);
        }
        
        [data-theme="dark"] {
            --bg: #0a0a0a;
            --surface: #141414;
            --surface-alt: #1a1a1a;
            --text: #f5f5f5;
            --text-muted: #a3a3a3;
            --border: #2a2a2a;
            --primary: #3b82f6;
            --primary-light: rgba(59, 130, 246, 0.15);
        }
        
        body {
            font-family: 'Jost', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }
        
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }
        
        .tagline {
            color: var(--text-muted);
            font-size: 1.1rem;
        }
        
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            cursor: pointer;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 100;
        }
        
        .theme-toggle:hover {
            border-color: var(--primary);
            transform: scale(1.05);
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 1.5rem;
        }
        
        .controls {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            height: fit-content;
        }
        
        .control-group {
            margin-bottom: 1.25rem;
        }
        
        .control-group:last-child {
            margin-bottom: 0;
        }
        
        .control-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text);
        }
        
        .size-inputs {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        
        .size-inputs input {
            flex: 1;
            padding: 0.6rem 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            text-align: center;
        }
        
        .size-inputs input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .size-inputs span {
            color: var(--text-muted);
            font-weight: 500;
        }
        
        .presets {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.5rem;
        }
        
        .preset-btn {
            padding: 0.35rem 0.6rem;
            font-size: 0.72rem;
            font-family: 'JetBrains Mono', monospace;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
            color: var(--text-muted);
        }
        
        .preset-btn:hover {
            border-color: var(--primary);
            color: var(--text);
        }
        
        .color-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        
        .color-input-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        
        .color-input-wrap span {
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        
        .color-input {
            width: 100%;
            height: 36px;
            padding: 2px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            cursor: pointer;
        }
        
        .color-input::-webkit-color-swatch-wrapper { padding: 0; }
        .color-input::-webkit-color-swatch { border: none; border-radius: 4px; }
        
        .swap-btn {
            padding: 0.5rem;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.15s;
            margin-top: 1rem;
        }
        
        .swap-btn:hover { border-color: var(--primary); }
        
        input[type="text"], select {
            width: 100%;
            padding: 0.6rem 0.75rem;
            font-family: 'Jost', sans-serif;
            font-size: 0.9rem;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
        }
        
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .btn {
            width: 100%;
            padding: 0.7rem 1rem;
            font-family: 'Jost', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .btn:active { transform: scale(0.98); }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-primary:hover { filter: brightness(1.1); }
        
        .btn-secondary {
            background: var(--surface-alt);
            color: var(--text);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover { border-color: var(--primary); }
        
        .btn-row {
            display: flex;
            gap: 0.5rem;
        }
        
        .btn-row .btn { flex: 1; }
        
        .preview-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: var(--surface-alt);
            border-bottom: 1px solid var(--border);
        }
        
        .preview-title {
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .preview-info {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        
        .preview-container {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            min-height: 350px;
            background: repeating-conic-gradient(var(--surface-alt) 0% 25%, var(--surface) 0% 50%) 50% / 16px 16px;
        }
        
        #preview-canvas {
            max-width: 100%;
            max-height: 400px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .url-section {
            padding: 1rem;
            border-top: 1px solid var(--border);
        }
        
        .url-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }
        
        .url-box {
            display: flex;
            gap: 0.5rem;
        }
        
        .url-input {
            flex: 1;
            padding: 0.6rem 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
        }
        
        .url-input:focus { outline: none; border-color: var(--primary); }
        
        .copy-btn {
            padding: 0.6rem 1rem;
            font-size: 0.8rem;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Jost', sans-serif;
            color: var(--text);
            transition: all 0.15s;
        }
        
        .copy-btn:hover { border-color: var(--primary); }
        
        footer {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        
        footer a { color: var(--text); text-decoration: none; }
        footer a:hover { text-decoration: underline; }
        
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: var(--bg);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 1000;
            animation: toastIn 0.25s ease;
        }
        
        @keyframes toastIn {
            from { opacity: 0; transform: translate(-50%, 10px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        
        .divider {
            height: 1px;
            background: var(--border);
            margin: 1.25rem 0;
        }
        
        @media (max-width: 768px) {
            h1 { font-size: 1.75rem; }
            .main-grid { grid-template-columns: 1fr; }
            .preview-section { order: -1; }
            .preview-container { min-height: 250px; }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
    
    <div class="container">
        <header>
            <h1>Placeholder Image Generator</h1>
            <p class="tagline">Generate custom placeholder images for mockups and prototypes</p>
        </header>
        
        <main class="main-grid">
            <div class="controls">
                <div class="control-group">
                    <label class="control-label">Dimensions</label>
                    <div class="size-inputs">
                        <input type="number" id="width" value="400" min="1" max="4000" oninput="generate()">
                        <span>×</span>
                        <input type="number" id="height" value="300" min="1" max="4000" oninput="generate()">
                    </div>
                    <div class="presets">
                        <button class="preset-btn" onclick="setSize(1920,1080)">1920×1080</button>
                        <button class="preset-btn" onclick="setSize(1280,720)">1280×720</button>
                        <button class="preset-btn" onclick="setSize(800,600)">800×600</button>
                        <button class="preset-btn" onclick="setSize(400,300)">400×300</button>
                        <button class="preset-btn" onclick="setSize(300,300)">300×300</button>
                        <button class="preset-btn" onclick="setSize(150,150)">150×150</button>
                        <button class="preset-btn" onclick="setSize(1200,630)">OG Image</button>
                        <button class="preset-btn" onclick="setSize(1080,1080)">Instagram</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Colors</label>
                    <div class="color-row">
                        <div class="color-input-wrap">
                            <span>Background</span>
                            <input type="color" class="color-input" id="bg-color" value="#cccccc" onchange="generate()">
                        </div>
                        <button class="swap-btn" onclick="swapColors()" title="Swap">⇄</button>
                        <div class="color-input-wrap">
                            <span>Text</span>
                            <input type="color" class="color-input" id="text-color" value="#666666" onchange="generate()">
                        </div>
                    </div>
                    <div class="presets" style="margin-top: 0.75rem;">
                        <button class="preset-btn" onclick="setColors('#cccccc','#666666')">Gray</button>
                        <button class="preset-btn" onclick="setColors('#3498db','#ffffff')">Blue</button>
                        <button class="preset-btn" onclick="setColors('#2ecc71','#ffffff')">Green</button>
                        <button class="preset-btn" onclick="setColors('#e74c3c','#ffffff')">Red</button>
                        <button class="preset-btn" onclick="setColors('#9b59b6','#ffffff')">Purple</button>
                        <button class="preset-btn" onclick="setColors('#1a1a1a','#ffffff')">Dark</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Text (optional)</label>
                    <input type="text" id="custom-text" placeholder="Leave empty for dimensions" oninput="generate()">
                </div>
                
                <div class="control-group">
                    <label class="control-label">Format</label>
                    <select id="format" onchange="generate()">
                        <option value="png">PNG</option>
                        <option value="jpeg">JPEG</option>
                        <option value="webp">WebP</option>
                    </select>
                </div>
                
                <div class="divider"></div>
                
                <div class="control-group btn-row">
                    <button class="btn btn-secondary" onclick="randomize()">🎲 Random</button>
                    <button class="btn btn-primary" onclick="download()">📥 Download</button>
                </div>
            </div>
            
            <div class="preview-section">
                <div class="preview-header">
                    <span class="preview-title">Preview</span>
                    <span class="preview-info" id="preview-info">400×300</span>
                </div>
                <div class="preview-container">
                    <canvas id="preview-canvas"></canvas>
                </div>
                <div class="url-section">
                    <div class="url-label">Direct URL (data URI)</div>
                    <div class="url-box">
                        <input type="text" class="url-input" id="url-output" readonly>
                        <button class="copy-btn" onclick="copyUrl()">Copy</button>
                    </div>
                </div>
            </div>
        </main>
        
        <footer>
            <a href="https://aikemist.com">aikemist.com</a> · Made by <a href="https://alkemist.no">Alkemist</a>
        </footer>
    </div>

    <script>
        // Theme
        const theme = localStorage.getItem('theme') || 
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        updateThemeIcon();
        
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeIcon();
        }
        
        function updateThemeIcon() {
            const btn = document.querySelector('.theme-toggle');
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            btn.textContent = isDark ? '☀️' : '🌙';
        }
        
        const canvas = document.getElementById('preview-canvas');
        const ctx = canvas.getContext('2d');
        
        function generate() {
            const width = Math.min(4000, Math.max(1, parseInt(document.getElementById('width').value) || 400));
            const height = Math.min(4000, Math.max(1, parseInt(document.getElementById('height').value) || 300));
            const bgColor = document.getElementById('bg-color').value;
            const textColor = document.getElementById('text-color').value;
            const customText = document.getElementById('custom-text').value;
            const format = document.getElementById('format').value;
            
            canvas.width = width;
            canvas.height = height;
            
            // Background
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, width, height);
            
            // Text
            const text = customText || `${width}×${height}`;
            const fontSize = Math.max(12, Math.min(width, height) / 8);
            
            ctx.fillStyle = textColor;
            ctx.font = `600 ${fontSize}px Jost, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, width / 2, height / 2);
            
            // Update info
            document.getElementById('preview-info').textContent = `${width}×${height}`;
            
            // Update URL
            const mimeType = format === 'jpeg' ? 'image/jpeg' : format === 'webp' ? 'image/webp' : 'image/png';
            const dataUrl = canvas.toDataURL(mimeType, 0.9);
            document.getElementById('url-output').value = dataUrl.substring(0, 100) + '...';
        }
        
        function setSize(w, h) {
            document.getElementById('width').value = w;
            document.getElementById('height').value = h;
            generate();
        }
        
        function setColors(bg, text) {
            document.getElementById('bg-color').value = bg;
            document.getElementById('text-color').value = text;
            generate();
        }
        
        function swapColors() {
            const bg = document.getElementById('bg-color');
            const text = document.getElementById('text-color');
            [bg.value, text.value] = [text.value, bg.value];
            generate();
        }
        
        function randomize() {
            const sizes = [[400,300],[800,600],[1280,720],[600,400],[500,500],[1200,630]];
            const [w, h] = sizes[Math.floor(Math.random() * sizes.length)];
            document.getElementById('width').value = w;
            document.getElementById('height').value = h;
            document.getElementById('bg-color').value = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');
            document.getElementById('text-color').value = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');
            generate();
        }
        
        function download() {
            const format = document.getElementById('format').value;
            const ext = format === 'jpeg' ? 'jpg' : format;
            const mimeType = format === 'jpeg' ? 'image/jpeg' : format === 'webp' ? 'image/webp' : 'image/png';
            
            const link = document.createElement('a');
            link.download = `placeholder-${canvas.width}x${canvas.height}.${ext}`;
            link.href = canvas.toDataURL(mimeType, 0.9);
            link.click();
            showToast('Downloaded!');
        }
        
        function copyUrl() {
            const format = document.getElementById('format').value;
            const mimeType = format === 'jpeg' ? 'image/jpeg' : format === 'webp' ? 'image/webp' : 'image/png';
            const dataUrl = canvas.toDataURL(mimeType, 0.9);
            navigator.clipboard.writeText(dataUrl).then(() => {
                showToast('Data URL copied!');
            });
        }
        
        function showToast(message) {
            document.querySelectorAll('.toast').forEach(t => t.remove());
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
        
        // Initialize
        generate();
    </script>
</body>
</html>
