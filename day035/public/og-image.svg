<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e0e0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Content -->
  <text x="100" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="white">Gradient Generator</text>
  <text x="100" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="rgba(255,255,255,0.8)">Linear • Radial • Conic • Repeating</text>
  
  <!-- Logo -->
  <g transform="translate(100, 480)">
    <rect width="48" height="48" rx="10" fill="url(#logoGrad)"/>
    <path d="M14 34L24 14L34 34" stroke="#6366f1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="24" cy="28" r="3" fill="#6366f1"/>
  </g>
  <text x="160" y="515" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="white">Alkemist</text>
  
  <!-- URL -->
  <text x="1100" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="rgba(255,255,255,0.6)" text-anchor="end">day035.aikemist.com</text>
</svg>
