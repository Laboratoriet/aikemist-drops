            font-size: 0.75rem;

        /* Actions */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0.875rem 1rem;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.9rem;

            cursor: pointer;
            transition: all 0.2s;

        .action-btn.primary {

        }
        
        .action-btn.primary:hover {
            background: var(--accent-hover);

        .action-btn.secondary {
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);

        .action-btn.secondary:hover {

        /* CSS Output */
        .css-output {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem;
            font-family: 'SF Mono', Monaco, Consolas, monospace;
            font-size: 0.75rem;
            color: var(--text);
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 120px;
            overflow-y: auto;

            font-weight: 600;
            margin-bottom: 0.5rem;

            align-items: center;
            gap: 0.5rem;
        }
        
        .pro-features {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.6;
        }
        
        /* Footer */
        .footer {
            padding: 1.5rem 2rem;
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
        }
        
        .footer a {
            color: var(--text);
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text);
            color: var(--bg);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

                { offsetX: 3, offsetY: 3, blur: 0, color: '#666666', opacity: 1 },
                { offsetX: 4, offsetY: 4, blur: 0, color: '#555555', opacity: 1 },
                { offsetX: 5, offsetY: 5, blur: 0, color: '#444444', opacity: 1 },
                { offsetX: 6, offsetY: 6, blur: 8, color: '#000000', opacity: 0.4 }
            ],
            long: [
                { offsetX: 1, offsetY: 1, blur: 0, color: '#8b5cf6', opacity: 1 },
                { offsetX: 2, offsetY: 2, blur: 0, color: '#8b5cf6', opacity: 1 },
                { offsetX: 3, offsetY: 3, blur: 0, color: '#8b5cf6', opacity: 1 },
                { offsetX: 4, offsetY: 4, blur: 0, color: '#8b5cf6', opacity: 1 },
                { offsetX: 5, offsetY: 5, blur: 0, color: '#8b5cf6', opacity: 1 },
                { offsetX: 6, offsetY: 6, blur: 0, color: '#8b5cf6', opacity: 1 },
                { offsetX: 7, offsetY: 7, blur: 0, color: '#8b5cf6', opacity: 1 },
                { offsetX: 8, offsetY: 8, blur: 0, color: '#8b5cf6', opacity: 1 }
            ],
            retro: [
                { offsetX: 4, offsetY: 4, blur: 0, color: '#ff6b6b', opacity: 1 },
                { offsetX: 8, offsetY: 8, blur: 0, color: '#4ecdc4', opacity: 1 }
            ],
            outline: [
                { offsetX: -2, offsetY: -2, blur: 0, color: '#000000', opacity: 1 },
                { offsetX: 2, offsetY: -2, blur: 0, color: '#000000', opacity: 1 },
                { offsetX: -2, offsetY: 2, blur: 0, color: '#000000', opacity: 1 },
                { offsetX: 2, offsetY: 2, blur: 0, color: '#000000', opacity: 1 }
            ],
            fire: [
                { offsetX: 0, offsetY: -2, blur: 4, color: '#ff0000', opacity: 1 },
                { offsetX: 0, offsetY: -4, blur: 8, color: '#ff6600', opacity: 0.8 },
                { offsetX: 0, offsetY: -6, blur: 12, color: '#ffcc00', opacity: 0.6 },
                { offsetX: 0, offsetY: 4, blur: 8, color: '#000000', opacity: 0.3 }
            ]
        };
        
        // Backgrounds
        const backgrounds = {
            gradient1: 'linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)',
            gradient2: 'linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%)',
            gradient3: 'linear-gradient(135deg, #1a2a6c 0%, #b21f1f 50%, #fdbb2d 100%)',
            dark: '#0a0a0a',
            light: '#f5f5f5'
        };
        
        // Initialize with soft preset
        function init() {
            loadFromURL();
            if (layers.length === 0) {
                applyPreset('soft');
            }
            render();
        }
        
        // Create layer
        function createLayer(config = {}) {
            return {
                id: layerIdCounter++,
                offsetX: config.offsetX ?? 2,
                offsetY: config.offsetY ?? 2,
                blur: config.blur ?? 4,
                color: config.color ?? '#000000',
                opacity: config.opacity ?? 0.5
            };
        }
        
        // Render layer card
        function renderLayerCard(layer, index) {
            const card = document.createElement('div');
            card.className = 'layer-card';
            card.dataset.layerId = layer.id;
            
            card.innerHTML = `
                <div class="layer-header">
                    <span class="layer-title">Layer ${index + 1}</span>
                    <div class="layer-actions">
                        <button class="layer-action-btn delete" data-action="delete" title="Remove layer">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 6L6 18M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="layer-controls">
                    <div class="control-group">
                        <label class="control-label">
                            <span>Offset X</span>
                            <span class="control-value">${layer.offsetX}px</span>
                        </label>
                        <input type="range" class="control-slider" data-prop="offsetX" min="-50" max="50" value="${layer.offsetX}">
                    </div>
                    <div class="control-group">
                        <label class="control-label">
                            <span>Offset Y</span>
                            <span class="control-value">${layer.offsetY}px</span>
                        </label>
                        <input type="range" class="control-slider" data-prop="offsetY" min="-50" max="50" value="${layer.offsetY}">
                    </div>
                    <div class="control-group">
                        <label class="control-label">
                            <span>Blur</span>
                            <span class="control-value">${layer.blur}px</span>
                        </label>
                        <input type="range" class="control-slider" data-prop="blur" min="0" max="100" value="${layer.blur}">
                    </div>
                    <div class="control-group">
                        <label class="control-label">
                            <span>Opacity</span>
                            <span class="control-value">${Math.round(layer.opacity * 100)}%</span>
                        </label>
                        <input type="range" class="control-slider" data-prop="opacity" min="0" max="100" value="${layer.opacity * 100}">
                    </div>
                    <div class="control-group full">
                        <label class="control-label">Color</label>
                        <div class="color-input-wrapper">
                            <input type="color" class="color-picker" data-prop="color" value="${layer.color}">
                            <input type="text" class="color-hex" data-prop="colorHex" value="${layer.color}">
                        </div>
                    </div>
                </div>
            `;
            
            return card;
        }
        
        // Render all layers
        function renderLayers() {
            layersList.innerHTML = '';
            layers.forEach((layer, index) => {
                layersList.appendChild(renderLayerCard(layer, index));
            });
        }
        
        // Generate CSS
        function generateCSS() {
            if (layers.length === 0) return 'text-shadow: none;';
            
            const shadows = layers.map(layer => {
                const r = parseInt(layer.color.slice(1, 3), 16);
                const g = parseInt(layer.color.slice(3, 5), 16);
                const b = parseInt(layer.color.slice(5, 7), 16);
                return `${layer.offsetX}px ${layer.offsetY}px ${layer.blur}px rgba(${r}, ${g}, ${b}, ${layer.opacity})`;
            });
            
            return `text-shadow: ${shadows.join(',\n             ')};`;
        }
        
        // Update preview
        function updatePreview() {
            if (layers.length === 0) {
                previewText.style.textShadow = 'none';
            } else {
                const shadows = layers.map(layer => {
                    const r = parseInt(layer.color.slice(1, 3), 16);
                    const g = parseInt(layer.color.slice(3, 5), 16);
                    const b = parseInt(layer.color.slice(5, 7), 16);
                    return `${layer.offsetX}px ${layer.offsetY}px ${layer.blur}px rgba(${r}, ${g}, ${b}, ${layer.opacity})`;
                });
                previewText.style.textShadow = shadows.join(', ');
            }
            
            cssOutput.textContent = generateCSS();
        }
        
        // Apply preset
        function applyPreset(presetName) {
            layers = presets[presetName].map(config => createLayer(config));
            
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.preset === presetName);
            });
            
            renderLayers();
            updatePreview();
        }
        
        // Full render
        function render() {
            renderLayers();
            updatePreview();
        }
        
        // Event: Text input
        textInput.addEventListener('input', (e) => {
            previewText.textContent = e.target.value || 'SHADOW';
        });
        
        // Event: Text color
        textColorPicker.addEventListener('input', (e) => {
            textColor = e.target.value;
            textColorHex.value = textColor;
            previewText.style.color = textColor;
        });
        
        textColorHex.addEventListener('input', (e) => {
            if (/^#[0-9A-Fa-f]{6}$/.test(e.target.value)) {
                textColor = e.target.value;
                textColorPicker.value = textColor;
                previewText.style.color = textColor;
            }
        });
        
        // Event: Font selection
        document.querySelectorAll('.font-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.font-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFont = btn.dataset.font;
                previewText.style.fontFamily = `'${currentFont}', sans-serif`;
            });
        });
        
        // Event: Preset selection
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                applyPreset(btn.dataset.preset);
            });
        });
        
        // Event: Background selection
        document.querySelectorAll('.bg-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.bg-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                previewBg.style.background = backgrounds[btn.dataset.bg];
            });
        });
        
        // Event: Add layer
        document.getElementById('addLayerBtn').addEventListener('click', () => {
            layers.push(createLayer());
            render();
            
            // Clear preset selection
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
        });
        
        // Event: Layer controls (delegation)
        layersList.addEventListener('input', (e) => {
            const card = e.target.closest('.layer-card');
            if (!card) return;
            
            const layerId = parseInt(card.dataset.layerId);
            const layer = layers.find(l => l.id === layerId);
            if (!layer) return;
            
            const prop = e.target.dataset.prop;
            
            if (prop === 'offsetX' || prop === 'offsetY' || prop === 'blur') {
                layer[prop] = parseInt(e.target.value);
                e.target.previousElementSibling.querySelector('.control-value').textContent = `${layer[prop]}px`;
            } else if (prop === 'opacity') {
                layer.opacity = parseInt(e.target.value) / 100;
                e.target.previousElementSibling.querySelector('.control-value').textContent = `${Math.round(layer.opacity * 100)}%`;
            } else if (prop === 'color') {
                layer.color = e.target.value;
                const hexInput = card.querySelector('[data-prop="colorHex"]');
                if (hexInput) hexInput.value = layer.color;
            } else if (prop === 'colorHex') {
                if (/^#[0-9A-Fa-f]{6}$/.test(e.target.value)) {
                    layer.color = e.target.value;
                    const picker = card.querySelector('[data-prop="color"]');
                    if (picker) picker.value = layer.color;
                }
            }
            
            // Clear preset selection
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
            
            updatePreview();
        });
        
        // Event: Delete layer
        layersList.addEventListener('click', (e) => {
            const deleteBtn = e.target.closest('[data-action="delete"]');
            if (!deleteBtn) return;
            
            const card = deleteBtn.closest('.layer-card');
            const layerId = parseInt(card.dataset.layerId);
            layers = layers.filter(l => l.id !== layerId);
            
            render();
        });
        
        // Event: Copy CSS
        document.getElementById('copyBtn').addEventListener('click', async () => {
            const css = generateCSS();
            await navigator.clipboard.writeText(css);
            showToast('Copied to clipboard!');
        });
        
        // Event: Share URL
        document.getElementById('shareBtn').addEventListener('click', async () => {
            const state = {
                text: textInput.value,
                font: currentFont,
                color: textColor,
                layers: layers.map(l => ({
                    x: l.offsetX,
                    y: l.offsetY,
                    b: l.blur,
                    c: l.color,
                    o: l.opacity
                }))
            };
            
            const encoded = btoa(JSON.stringify(state));
            const url = `${location.origin}${location.pathname}?s=${encoded}`;
            
            await navigator.clipboard.writeText(url);
            showToast('Share URL copied!');
        });
        
        // Load from URL
        function loadFromURL() {
            const params = new URLSearchParams(location.search);
            const encoded = params.get('s');
            
            if (encoded) {
                try {
                    const state = JSON.parse(atob(encoded));
                    
                    if (state.text) {
                        textInput.value = state.text;
                        previewText.textContent = state.text;
                    }
                    
                    if (state.font) {
                        currentFont = state.font;
                        previewText.style.fontFamily = `'${currentFont}', sans-serif`;
                        document.querySelectorAll('.font-btn').forEach(btn => {
                            btn.classList.toggle('active', btn.dataset.font === currentFont);
                        });
                    }
                    
                    if (state.color) {
                        textColor = state.color;
                        textColorPicker.value = textColor;
                        textColorHex.value = textColor;
                        previewText.style.color = textColor;
                    }
                    
                    if (state.layers) {
                        layers = state.layers.map(l => createLayer({
                            offsetX: l.x,
                            offsetY: l.y,
                            blur: l.b,
                            color: l.c,
                            opacity: l.o
                        }));
                    }
                } catch (e) {
                    console.error('Failed to load state from URL');
                }
            }
        }
        
        // Theme toggle
        document.getElementById('themeToggle').addEventListener('click', () => {
            const body = document.body;
            const isDark = body.dataset.theme === 'dark';
            body.dataset.theme = isDark ? 'light' : 'dark';
        });
        
        // Toast
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
        
        // Init
        init();
    </script>
</body>
</html>
