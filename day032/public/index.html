<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetic Type | Alkemist</title>
    <meta name="description" content="Create mesmerizing animated text effects. Wave, glitch, bounce, rainbow and more. Export as GIF.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;900&family=Space+Grotesk:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --bg: #0a0a0a;
            --bg-subtle: #111;
            --bg-card: #161616;
            --border: #2a2a2a;
            --text: #f5f5f5;
            --text-muted: #888;
            --accent: #7c3aed;
            --font: 'Jost', sans-serif;
            --mono: 'JetBrains Mono', monospace;
        }
        
        [data-theme="light"] {
            --bg: #fafafa;
            --bg-subtle: #f0f0f0;
            --bg-card: #fff;
            --border: #e0e0e0;
            --text: #1a1a1a;
            --text-muted: #666;
        }
        
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .header {
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: relative;
            z-index: 100;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            color: var(--text);
        }
        
        .logo-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.875rem;
            color: #fff;
        }
        
        .header-actions { display: flex; gap: 0.5rem; }
        
        .header-btn {
            padding: 0.5rem 0.875rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text);
            font-family: var(--font);
            font-size: 0.8125rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.375rem;
            transition: all 0.15s;
        }
        
        .header-btn:hover { border-color: var(--accent); }
        .header-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .header-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .main {
            display: grid;
            grid-template-columns: 300px 1fr;
            min-height: calc(100vh - 57px);
        }
        
        @media (max-width: 900px) { .main { grid-template-columns: 1fr; } }
        
        .controls {
            padding: 1.25rem;
            border-right: 1px solid var(--border);
            background: var(--bg-subtle);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
            max-height: calc(100vh - 57px);
        }
        
        .control-group { display: flex; flex-direction: column; gap: 0.5rem; }
        
        .control-label {
            font-size: 0.6875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }
        
        .text-input {
            width: 100%;
            padding: 0.625rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text);
            font-family: var(--font);
            font-size: 1rem;
        }
        
        .text-input:focus { outline: none; border-color: var(--accent); }
        
        .effect-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.375rem;
        }
        
        .effect-btn {
            padding: 0.5rem 0.25rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-card);
            color: var(--text);
            font-family: var(--font);
            font-size: 0.6875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
        }
        
        .effect-btn:hover { border-color: var(--accent); }
        .effect-btn.active { border-color: var(--accent); background: var(--accent); color: #fff; }
        
        .select-input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text);
            font-family: var(--font);
            font-size: 0.8125rem;
            cursor: pointer;
        }
        
        .slider-row { display: flex; align-items: center; gap: 0.5rem; }
        
        .slider-row input[type="range"] {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background: var(--border);
            appearance: none;
            cursor: pointer;
        }
        
        .slider-row input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }
        
        .slider-value {
            min-width: 40px;
            font-family: var(--mono);
            font-size: 0.6875rem;
            color: var(--text-muted);
            text-align: right;
        }
        
        .color-row { display: flex; gap: 0.5rem; }
        
        .color-picker {
            width: 36px;
            height: 32px;
            border-radius: 6px;
            border: 2px solid var(--border);
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }
        
        .color-picker input {
            position: absolute;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            cursor: pointer;
            border: none;
        }
        
        .color-hex {
            flex: 1;
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-card);
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.75rem;
            text-transform: uppercase;
        }
        
        .preview-area {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            min-height: 500px;
        }
        
        .capture-zone {
            width: 800px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .kinetic-text {
            font-size: 5rem;
            font-weight: 700;
            text-align: center;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            white-space: nowrap;
        }
        
        .kinetic-text .char {
            display: inline-block;
        }
        
        .kinetic-text .space { width: 0.3em; }
        
        /* Animations */
        @keyframes wave {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-25px); }
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0) scaleY(1); }
            30% { transform: translateY(-35px) scaleY(1.1); }
            50% { transform: translateY(0) scaleY(0.9); }
            70% { transform: translateY(-15px); }
        }
        
        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-3px, 3px); filter: hue-rotate(90deg); }
            40% { transform: translate(3px, -3px); filter: hue-rotate(180deg); }
            60% { transform: translate(-3px, -3px); }
            80% { transform: translate(3px, 3px); filter: none; }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-15px) rotate(3deg); }
            75% { transform: translateY(15px) rotate(-3deg); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.8; }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
        }
        
        @keyframes flip {
            0% { transform: rotateY(0); }
            50% { transform: rotateY(180deg); }
            100% { transform: rotateY(360deg); }
        }
        
        @keyframes swing {
            0%, 100% { transform: rotate(0deg); transform-origin: top center; }
            25% { transform: rotate(20deg); }
            75% { transform: rotate(-20deg); }
        }
        
        @keyframes rubberband {
            0% { transform: scale(1, 1); }
            30% { transform: scale(1.3, 0.7); }
            40% { transform: scale(0.7, 1.3); }
            50% { transform: scale(1.15, 0.85); }
            65% { transform: scale(0.95, 1.05); }
            75% { transform: scale(1.05, 0.95); }
            100% { transform: scale(1, 1); }
        }
        
        @keyframes jello {
            0%, 100% { transform: skewX(0deg) skewY(0deg); }
            22% { transform: skewX(-15deg) skewY(-15deg); }
            33% { transform: skewX(10deg) skewY(10deg); }
            44% { transform: skewX(-5deg) skewY(-5deg); }
        }
        
        @keyframes rainbow {
            0% { color: #ff0000; }
            16% { color: #ff8800; }
            33% { color: #ffff00; }
            50% { color: #00ff00; }
            66% { color: #0088ff; }
            83% { color: #8800ff; }
            100% { color: #ff0000; }
        }
        
        @keyframes neon {
            0%, 100% { text-shadow: 0 0 10px currentColor, 0 0 20px currentColor, 0 0 40px currentColor; opacity: 1; }
            50% { text-shadow: 0 0 5px currentColor, 0 0 10px currentColor; opacity: 0.8; }
        }
        
        .effect-wave .char { animation: wave var(--speed) ease-in-out infinite; }
        .effect-bounce .char { animation: bounce var(--speed) ease-in-out infinite; }
        .effect-glitch .char { animation: glitch calc(var(--speed) * 0.5) steps(1) infinite; }
        .effect-float .char { animation: float var(--speed) ease-in-out infinite; }
        .effect-pulse .char { animation: pulse var(--speed) ease-in-out infinite; }
        .effect-shake .char { animation: shake calc(var(--speed) * 0.4) ease-in-out infinite; }
        .effect-flip .char { animation: flip var(--speed) ease-in-out infinite; }
        .effect-swing .char { animation: swing var(--speed) ease-in-out infinite; }
        .effect-rubberband .char { animation: rubberband var(--speed) ease-in-out infinite; }
        .effect-jello .char { animation: jello var(--speed) ease-in-out infinite; }
        .effect-rainbow .char { animation: rainbow calc(var(--speed) * 2) linear infinite; }
        .effect-neon .char { animation: neon var(--speed) ease-in-out infinite; }
        
        .footer {
            padding: 1.5rem;
            text-align: center;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.8125rem;
        }
        
        .footer a { color: var(--text); text-decoration: none; }
        .footer a:hover { color: var(--accent); }
        
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 0.75rem 1.25rem;
            background: var(--accent);
            color: #fff;
            border-radius: 8px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal-overlay.visible { display: flex; }
        
        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        
        .modal h3 { margin-bottom: 1rem; font-size: 1.25rem; }
        
        .modal-progress {
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 1rem;
        }
        
        .modal-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #a855f7);
            width: 0%;
            transition: width 0.1s;
        }
        
        .modal-status { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem; }
        
        .modal-actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
        
        .modal-btn {
            padding: 0.75rem 1.5rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text);
            font-family: var(--font);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
        }
        
        .modal-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        
        .gif-preview {
            max-width: 100%;
            max-height: 300px;
            border-radius: 12px;
            margin-bottom: 1rem;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="https://aikemist.com" class="logo">
            <div class="logo-icon">A</div>
            <span>Kinetic Type</span>
        </a>
        <div class="header-actions">
            <button class="header-btn" onclick="copyCSS()">📋 CSS</button>
            <button class="header-btn primary" onclick="startGifExport()" id="gif-btn">🎬 Export GIF</button>
            <button class="header-btn" onclick="randomize()">🎲</button>
            <button class="header-btn" onclick="toggleTheme()"><span class="theme-icon">🌙</span></button>
        </div>
    </header>

    <main class="main">
        <aside class="controls">
            <div class="control-group">
                <label class="control-label">Text</label>
                <input type="text" class="text-input" id="text-input" value="KINETIC" maxlength="10">
            </div>
            
            <div class="control-group">
                <label class="control-label">Effect</label>
                <div class="effect-grid">
                    <button class="effect-btn active" data-effect="wave">Wave</button>
                    <button class="effect-btn" data-effect="bounce">Bounce</button>
                    <button class="effect-btn" data-effect="glitch">Glitch</button>
                    <button class="effect-btn" data-effect="float">Float</button>
                    <button class="effect-btn" data-effect="pulse">Pulse</button>
                    <button class="effect-btn" data-effect="shake">Shake</button>
                    <button class="effect-btn" data-effect="flip">Flip</button>
                    <button class="effect-btn" data-effect="swing">Swing</button>
                    <button class="effect-btn" data-effect="rubberband">Rubber</button>
                    <button class="effect-btn" data-effect="jello">Jello</button>
                    <button class="effect-btn" data-effect="rainbow">Rainbow</button>
                    <button class="effect-btn" data-effect="neon">Neon</button>
                </div>
            </div>
            
            <div class="control-group">
                <label class="control-label">Font</label>
                <select class="select-input" id="font-select">
                    <option value="Jost">Jost</option>
                    <option value="Space Grotesk">Space Grotesk</option>
                    <option value="Inter">Inter</option>
                    <option value="Playfair Display">Playfair Display</option>
                    <option value="JetBrains Mono">JetBrains Mono</option>
                </select>
            </div>
            
            <div class="control-group">
                <label class="control-label">Size</label>
                <div class="slider-row">
                    <input type="range" id="size-slider" min="3" max="8" value="5" step="0.5">
                    <span class="slider-value" id="size-value">5rem</span>
                </div>
            </div>
            
            <div class="control-group">
                <label class="control-label">Speed</label>
                <div class="slider-row">
                    <input type="range" id="speed-slider" min="0.5" max="2.5" value="1" step="0.1">
                    <span class="slider-value" id="speed-value">1s</span>
                </div>
            </div>
            
            <div class="control-group">
                <label class="control-label">Stagger</label>
                <div class="slider-row">
                    <input type="range" id="stagger-slider" min="0" max="150" value="50">
                    <span class="slider-value" id="stagger-value">50ms</span>
                </div>
            </div>
            
            <div class="control-group">
                <label class="control-label">Text Color</label>
                <div class="color-row">
                    <div class="color-picker" id="color-preview" style="background: #ffffff">
                        <input type="color" id="text-color" value="#ffffff">
                    </div>
                    <input type="text" class="color-hex" id="color-hex" value="#FFFFFF" maxlength="7">
                </div>
            </div>
            
            <div class="control-group">
                <label class="control-label">Background</label>
                <div class="color-row">
                    <div class="color-picker" id="bg-preview" style="background: #0a0a0a">
                        <input type="color" id="bg-color" value="#0a0a0a">
                    </div>
                    <input type="text" class="color-hex" id="bg-hex" value="#0A0A0A" maxlength="7">
                </div>
            </div>
        </aside>

        <section class="preview-area" id="preview-area">
            <div class="capture-zone" id="capture-zone">
                <div class="kinetic-text effect-wave" id="kinetic-text"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <a href="https://aikemist.com">aikemist.com</a> · Made by <a href="https://alkemist.no">Alkemist</a>
    </footer>
    
    <div class="toast" id="toast">Copied!</div>
    
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3 id="modal-title">Exporting GIF...</h3>
            <div class="modal-progress">
                <div class="modal-progress-bar" id="progress-bar"></div>
            </div>
            <p class="modal-status" id="modal-status">Capturing frames...</p>
            <img class="gif-preview" id="gif-preview" style="display: none;">
            <div class="modal-actions">
                <button class="modal-btn" onclick="closeModal()">Close</button>
                <a class="modal-btn primary" id="download-btn" style="display: none;" download>⬇ Download GIF</a>
            </div>
        </div>
    </div>

    <script>
        let state = {
            text: 'KINETIC',
            effect: 'wave',
            font: 'Jost',
            size: 5,
            speed: 1,
            stagger: 50,
            textColor: '#ffffff',
            bgColor: '#0a0a0a'
        };
        
        const kineticText = document.getElementById('kinetic-text');
        const captureZone = document.getElementById('capture-zone');
        const previewArea = document.getElementById('preview-area');
        
        function renderText() {
            const chars = state.text.split('').map((char, i) => {
                if (char === ' ') return `<span class="space"></span>`;
                const delay = i * state.stagger;
                return `<span class="char" style="animation-delay: ${delay}ms">${char}</span>`;
            }).join('');
            
            kineticText.innerHTML = chars;
            kineticText.className = `kinetic-text effect-${state.effect}`;
            kineticText.style.fontFamily = `'${state.font}', sans-serif`;
            kineticText.style.fontSize = `${state.size}rem`;
            kineticText.style.setProperty('--speed', `${state.speed}s`);
            kineticText.style.color = state.textColor;
            
            captureZone.style.background = state.bgColor;
            previewArea.style.background = state.bgColor;
        }
        
        // Event listeners
        document.getElementById('text-input').addEventListener('input', (e) => {
            state.text = e.target.value || 'TYPE';
            renderText();
        });
        
        document.querySelectorAll('.effect-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.effect-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.effect = btn.dataset.effect;
                renderText();
            });
        });
        
        document.getElementById('font-select').addEventListener('change', (e) => {
            state.font = e.target.value;
            renderText();
        });
        
        document.getElementById('size-slider').addEventListener('input', (e) => {
            state.size = parseFloat(e.target.value);
            document.getElementById('size-value').textContent = `${state.size}rem`;
            renderText();
        });
        
        document.getElementById('speed-slider').addEventListener('input', (e) => {
            state.speed = parseFloat(e.target.value);
            document.getElementById('speed-value').textContent = `${state.speed}s`;
            renderText();
        });
        
        document.getElementById('stagger-slider').addEventListener('input', (e) => {
            state.stagger = parseInt(e.target.value);
            document.getElementById('stagger-value').textContent = `${state.stagger}ms`;
            renderText();
        });
        
        // Colors
        document.getElementById('text-color').addEventListener('input', (e) => {
            state.textColor = e.target.value;
            document.getElementById('color-hex').value = e.target.value.toUpperCase();
            document.getElementById('color-preview').style.background = e.target.value;
            renderText();
        });
        
        document.getElementById('color-hex').addEventListener('input', (e) => {
            let val = e.target.value;
            if (!val.startsWith('#')) val = '#' + val;
            if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
                state.textColor = val;
                document.getElementById('text-color').value = val;
                document.getElementById('color-preview').style.background = val;
                renderText();
            }
        });
        
        document.getElementById('bg-color').addEventListener('input', (e) => {
            state.bgColor = e.target.value;
            document.getElementById('bg-hex').value = e.target.value.toUpperCase();
            document.getElementById('bg-preview').style.background = e.target.value;
            renderText();
        });
        
        document.getElementById('bg-hex').addEventListener('input', (e) => {
            let val = e.target.value;
            if (!val.startsWith('#')) val = '#' + val;
            if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
                state.bgColor = val;
                document.getElementById('bg-color').value = val;
                document.getElementById('bg-preview').style.background = val;
                renderText();
            }
        });
        
        // Copy CSS
        function copyCSS() {
            const css = `/* Kinetic Type - ${state.effect} */
.kinetic-container {
  background: ${state.bgColor};
  display: flex;
  align-items: center;
  justify-content: center;
}

.kinetic-text {
  font-family: '${state.font}', sans-serif;
  font-size: ${state.size}rem;
  font-weight: 700;
  color: ${state.textColor};
  display: flex;
}

  display: inline-block;

        // GIF Export - Actually works!
        let isExporting = false;
        
        async function startGifExport() {
            if (isExporting) return;
            isExporting = true;
            
            const modal = document.getElementById('modal');
            const progressBar = document.getElementById('progress-bar');
            const modalStatus = document.getElementById('modal-status');
            const modalTitle = document.getElementById('modal-title');
            const gifPreview = document.getElementById('gif-preview');
            const downloadBtn = document.getElementById('download-btn');
            
            modal.classList.add('visible');
            modalTitle.textContent = 'Exporting GIF...';
            progressBar.style.width = '0%';
            gifPreview.style.display = 'none';
            downloadBtn.style.display = 'none';
            
            const fps = 20;
            const duration = state.speed * 1000;
            const totalFrames = Math.min(Math.round(duration / (1000 / fps)), 40);
            const frameDelay = Math.round(duration / totalFrames);
            
            modalStatus.textContent = `Capturing ${totalFrames} frames...`;
            
            try {
                const gif = new GIF({
                    workers: 2,
                    quality: 10,
                    width: 800,
                    height: 400,
                    workerScript: 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js'
                });
                
                const frames = [];
                
                // Capture frames over time using html2canvas
                for (let i = 0; i < totalFrames; i++) {
                    modalStatus.textContent = `Capturing frame ${i + 1}/${totalFrames}...`;
                    progressBar.style.width = `${(i / totalFrames) * 50}%`;
                    
                    // Wait for animation to progress
                    await new Promise(resolve => setTimeout(resolve, frameDelay));
                    
                    // Capture the frame
                    const canvas = await html2canvas(captureZone, {
                        backgroundColor: state.bgColor,
                        scale: 1,
                        width: 800,
                        height: 400,
                        logging: false
                    });
                    
                    frames.push(canvas);
                }
                
                modalStatus.textContent = 'Encoding GIF...';
                
                // Add all frames to GIF
                frames.forEach((canvas, i) => {
                    gif.addFrame(canvas, { delay: frameDelay, copy: true });
                });
                
                gif.on('progress', (p) => {
                    progressBar.style.width = `${50 + p * 50}%`;
                    modalStatus.textContent = `Encoding... ${Math.round(p * 100)}%`;
                });
                
                gif.on('finished', (blob) => {
                    const url = URL.createObjectURL(blob);
                    gifPreview.src = url;
                    gifPreview.style.display = 'block';
                    downloadBtn.href = url;
                    downloadBtn.download = `kinetic-${state.text.toLowerCase().replace(/\s+/g, '-')}.gif`;
                    downloadBtn.style.display = 'inline-block';
                    modalTitle.textContent = '✨ GIF Ready!';
                    modalStatus.textContent = `Size: ${(blob.size / 1024).toFixed(1)} KB`;
                    progressBar.style.width = '100%';
                    isExporting = false;
                });
                
                gif.render();
                
            } catch (err) {
                console.error('GIF export error:', err);
                modalTitle.textContent = 'Export Failed';
                modalStatus.textContent = err.message;
                isExporting = false;
            }
        }
        
        function closeModal() {
            document.getElementById('modal').classList.remove('visible');
            isExporting = false;
        }
        
        function randomize() {
            const effects = ['wave', 'bounce', 'glitch', 'float', 'pulse', 'shake', 'flip', 'swing', 'rubberband', 'jello', 'rainbow', 'neon'];
            const words = ['KINETIC', 'MOTION', 'ANIMATE', 'GROOVE', 'RHYTHM', 'PULSE', 'VIBE', 'FLOW', 'ENERGY', 'MAGIC'];
            
            state.effect = effects[Math.floor(Math.random() * effects.length)];
            state.text = words[Math.floor(Math.random() * words.length)];
            state.speed = +(Math.random() * 1.5 + 0.5).toFixed(1);
            state.stagger = Math.floor(Math.random() * 100) + 30;
            state.textColor = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
            state.bgColor = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
            
            document.getElementById('text-input').value = state.text;
            document.getElementById('speed-slider').value = state.speed;
            document.getElementById('speed-value').textContent = `${state.speed}s`;
            document.getElementById('stagger-slider').value = state.stagger;
            document.getElementById('stagger-value').textContent = `${state.stagger}ms`;
            document.getElementById('text-color').value = state.textColor;
            document.getElementById('color-hex').value = state.textColor.toUpperCase();
            document.getElementById('color-preview').style.background = state.textColor;
            document.getElementById('bg-color').value = state.bgColor;
            document.getElementById('bg-hex').value = state.bgColor.toUpperCase();
            document.getElementById('bg-preview').style.background = state.bgColor;
            
            document.querySelectorAll('.effect-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.effect === state.effect);
            });
            
            renderText();
        }
        
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
        
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', next);
            document.querySelector('.theme-icon').textContent = next === 'light' ? '☀️' : '🌙';
            localStorage.setItem('theme', next);
        }
        
        // Init
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.querySelector('.theme-icon').textContent = savedTheme === 'light' ? '☀️' : '🌙';
            renderText();
        })();
    </script>
