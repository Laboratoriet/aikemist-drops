<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesh Gradient Generator — Create Beautiful Gradients from Any Image</title>
  <meta name="description" content="Extract colors from any image and generate stunning animated mesh gradients. Export as PNG, CSS, or Tailwind. Free tool by Alkemist.">
  <meta property="og:title" content="Mesh Gradient Generator">
  <meta property="og:description" content="Turn any image into a beautiful animated gradient.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://day001.aikemist.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg: #050505;
      --bg-card: #0d0d0d;
      --border: #1a1a1a;
      --text: #fafafa;
      --text-muted: #666;
      --accent: #818cf8;
      --radius: 16px;
      --radius-sm: 10px;
    }
    
    [data-theme="light"] {
      --bg: #fafafa;
      --bg-card: #ffffff;
      --border: #e5e5e5;
      --text: #0a0a0a;
      --text-muted: #666;
      --accent: #6366f1;
    }
    
    body {
      font-family: 'Jost', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    
    /* Theme Toggle */
    .theme-toggle {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s;
      z-index: 100;
    }
    
    .theme-toggle:hover { border-color: var(--accent); }
    .theme-icon { width: 20px; height: 20px; stroke: var(--text); stroke-width: 2; fill: none; }
    .icon-sun { display: none; }
    [data-theme="light"] .icon-sun { display: block; }
    [data-theme="light"] .icon-moon { display: none; }
    
    /* Header */
    header {
      text-align: center;
      margin-bottom: 3rem;
    }
    
    .logo {
      display: inline-block;
      margin-bottom: 2rem;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    
    .logo:hover { opacity: 1; }
    .logo svg { height: 24px; fill: var(--text); }
    
    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }
    
    .tagline {
      color: var(--text-muted);
      font-size: 1.125rem;
      max-width: 500px;
      margin: 0 auto;
    }
    
    /* Main Layout */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 2rem;
      align-items: start;
    }
    
    @media (max-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }
    
    /* Gradient Preview */
    .gradient-container {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--bg-card);
      border: 1px solid var(--border);
    }
    
    .gradient-preview {
      aspect-ratio: 16/10;
      position: relative;
      overflow: hidden;
      min-height: 400px;
    }
    
    .gradient-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      mix-blend-mode: normal;
    }
    
    .blob-animate {
      animation: floatBlob 20s ease-in-out infinite;
    }
    
    @keyframes floatBlob {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(10%, -15%) scale(1.1); }
      50% { transform: translate(-5%, 10%) scale(0.95); }
      75% { transform: translate(-10%, -5%) scale(1.05); }
    }
    
    /* Upload Overlay */
    .upload-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5, 5, 5, 0.85);
      backdrop-filter: blur(8px);
      cursor: pointer;
      transition: opacity 0.3s;
      z-index: 10;
    }
    
    [data-theme="light"] .upload-overlay {
      background: rgba(250, 250, 250, 0.9);
    }
    
    .upload-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .upload-overlay.dragover {
      background: rgba(99, 102, 241, 0.1);
      border: 2px dashed var(--accent);
    }
    
    .upload-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 1.5rem;
      stroke: var(--text-muted);
      stroke-width: 1.5;
      fill: none;
    }
    
    .upload-overlay h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    
    .upload-overlay p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    
    .upload-overlay input {
      display: none;
    }
    
    /* Palette Strip */
    .palette-strip {
      display: flex;
      border-top: 1px solid var(--border);
    }
    
    .palette-color {
      flex: 1;
      height: 48px;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s;
    }
    
    .palette-color:hover {
      transform: scaleY(1.2);
      z-index: 1;
    }
    
    .palette-color::after {
      content: attr(data-hex);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-family: monospace;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    
    .palette-color:hover::after {
      opacity: 1;
    }
    
    /* Controls Panel */
    .controls {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }
    
    .controls h3 {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }
    
    .control-group {
      margin-bottom: 1.5rem;
    }
    
    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }
    
    .control-group label span {
      color: var(--text-muted);
      font-family: monospace;
    }
    
    input[type="range"] {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      -webkit-appearance: none;
      outline: none;
    }
    
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
    }
    
    /* Background Toggle */
    .bg-toggle {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    
    .bg-toggle button {
      flex: 1;
      padding: 0.6rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    
    .bg-toggle .btn-dark {
      background: #0a0a0a;
      color: #fff;
    }
    
    .bg-toggle .btn-light {
      background: #f5f5f5;
      color: #0a0a0a;
    }
    
    .bg-toggle button.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent);
    }
    
    /* Action Buttons */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }
    
    .btn {
      padding: 0.875rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    
    .btn:hover {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.1);
    }
    
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    
    .btn-primary:hover {
      background: #6366f1;
      border-color: #6366f1;
    }
    
    .btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }
    
    /* Footer */
    footer {
      text-align: center;
      padding: 3rem 1.5rem 2rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    
    footer a {
      color: var(--text);
      text-decoration: none;
      transition: color 0.2s;
    }
    
    footer a:hover {
      color: var(--accent);
    }
    
    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 0.875rem 1.5rem;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
    }
    
    .toast.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    
    /* Loading */
    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 5, 5, 0.9);
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    
    .loading.visible {
      opacity: 1;
      pointer-events: auto;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* Mobile */
    @media (max-width: 600px) {
      .container { padding: 1rem; }
      h1 { font-size: 1.75rem; }
      .gradient-preview { min-height: 300px; }
      .controls { padding: 1.25rem; }
    }
  </style>
</head>

  <script>
    // State
    const state = {
      colors: ['#6366f1', '#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b'],
      blur: 80,
      size: 100,
      opacity: 75,
      bgDark: true,
      animating: true,
      blobs: []
    };

    // DOM
    const gradientPreview = document.getElementById('gradientPreview');
    const uploadOverlay = document.getElementById('uploadOverlay');
    const fileInput = document.getElementById('fileInput');
    const loading = document.getElementById('loading');
    const paletteStrip = document.getElementById('paletteStrip');
    const toast = document.getElementById('toast');

    // Init
    document.addEventListener('DOMContentLoaded', () => {
      renderGradient();
      setupEventListeners();
    });

    function setupEventListeners() {
      // Upload
      uploadOverlay.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', handleFile);
      uploadOverlay.addEventListener('dragover', e => { e.preventDefault(); uploadOverlay.classList.add('dragover'); });
      uploadOverlay.addEventListener('dragleave', () => uploadOverlay.classList.remove('dragover'));
      uploadOverlay.addEventListener('drop', e => { e.preventDefault(); uploadOverlay.classList.remove('dragover'); if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]); });

      // Background toggle
      document.getElementById('bgDark').addEventListener('click', () => setBg(true));
      document.getElementById('bgLight').addEventListener('click', () => setBg(false));

      // Sliders
      document.getElementById('blurSlider').addEventListener('input', e => { state.blur = +e.target.value; document.getElementById('blurVal').textContent = state.blur + 'px'; updateBlobs(); });
      document.getElementById('sizeSlider').addEventListener('input', e => { state.size = +e.target.value; document.getElementById('sizeVal').textContent = state.size + '%'; updateBlobs(); });
      document.getElementById('opacitySlider').addEventListener('input', e => { state.opacity = +e.target.value; document.getElementById('opacityVal').textContent = state.opacity + '%'; updateBlobs(); });

      // Actions
      document.getElementById('randomizeBtn').addEventListener('click', randomize);
      document.getElementById('toggleAnimBtn').addEventListener('click', toggleAnimation);
      document.getElementById('copyCssBtn').addEventListener('click', copyCss);
      document.getElementById('downloadBtn').addEventListener('click', downloadPng);
    }

    function handleFile(e) {
      const file = e.target.files[0];
      if (file) processFile(file);
    }

    function processFile(file) {
      loading.classList.add('visible');
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => extractColors(img);
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function extractColors(img) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const size = 100;
      canvas.width = canvas.height = size;
      ctx.drawImage(img, 0, 0, size, size);
      const data = ctx.getImageData(0, 0, size, size).data;

      // Sample pixels and cluster
      const pixels = [];
      for (let i = 0; i < data.length; i += 16) {
        if (data[i+3] > 128) pixels.push([data[i], data[i+1], data[i+2]]);
      }

      // Simple k-means
      const k = 5;
      let centroids = pixels.slice(0, k).map(p => [...p]);
      
      for (let iter = 0; iter < 10; iter++) {
        const clusters = Array(k).fill().map(() => []);
        for (const p of pixels) {
          let minD = Infinity, idx = 0;
          for (let i = 0; i < k; i++) {
            const d = Math.hypot(p[0]-centroids[i][0], p[1]-centroids[i][1], p[2]-centroids[i][2]);
            if (d < minD) { minD = d; idx = i; }
          }
          clusters[idx].push(p);
        }
        for (let i = 0; i < k; i++) {
          if (clusters[i].length) {
            centroids[i] = [
              Math.round(clusters[i].reduce((s,p) => s+p[0], 0) / clusters[i].length),
              Math.round(clusters[i].reduce((s,p) => s+p[1], 0) / clusters[i].length),
              Math.round(clusters[i].reduce((s,p) => s+p[2], 0) / clusters[i].length)
            ];
          }
        }
      }

      // Convert to hex and sort by luminance
      state.colors = centroids
        .map(c => '#' + c.map(v => v.toString(16).padStart(2,'0')).join(''))
        .sort((a,b) => getLuminance(b) - getLuminance(a));

      loading.classList.remove('visible');
      uploadOverlay.classList.add('hidden');
      renderGradient();
      renderPalette();
    }

    function getLuminance(hex) {
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      return 0.299*r + 0.587*g + 0.114*b;
    }

    function renderGradient() {
      // Clear existing blobs
      state.blobs.forEach(b => b.remove());
      state.blobs = [];

      const preview = gradientPreview;
      preview.style.background = state.bgDark ? '#050505' : '#fafafa';

      // Create blobs
      state.colors.forEach((color, i) => {
        const blob = document.createElement('div');
        blob.className = 'gradient-blob' + (state.animating ? ' blob-animate' : '');
        
        const baseSize = 200 + Math.random() * 150;
        const size = baseSize * (state.size / 100);
        
        blob.style.cssText = `
          width: ${size}px;
          height: ${size}px;
          background: ${color};
          filter: blur(${state.blur}px);
          opacity: ${state.opacity / 100};
          left: ${10 + Math.random() * 60}%;
          top: ${10 + Math.random() * 60}%;
          animation-delay: ${-i * 4}s;
        `;
        
        preview.appendChild(blob);
        state.blobs.push(blob);
      });
    }

    function updateBlobs() {
      state.blobs.forEach((blob, i) => {
        const baseSize = 200 + (i * 30);
        const size = baseSize * (state.size / 100);
        blob.style.width = size + 'px';
        blob.style.height = size + 'px';
        blob.style.filter = `blur(${state.blur}px)`;
        blob.style.opacity = state.opacity / 100;
      });
    }

    function renderPalette() {
      paletteStrip.innerHTML = state.colors.map(color => 
        `<div class="palette-color" style="background:${color}" data-hex="${color.toUpperCase()}" onclick="copyColor('${color}')"></div>`
      ).join('');
    }

    function copyColor(color) {
      navigator.clipboard.writeText(color.toUpperCase());
      showToast('Copied ' + color.toUpperCase());
    }

    function setBg(dark) {
      state.bgDark = dark;
      document.getElementById('bgDark').classList.toggle('active', dark);
      document.getElementById('bgLight').classList.toggle('active', !dark);
      gradientPreview.style.background = dark ? '#050505' : '#fafafa';
    }

    function randomize() {
      state.blobs.forEach(blob => {
        blob.style.left = (10 + Math.random() * 60) + '%';
        blob.style.top = (10 + Math.random() * 60) + '%';
      });
    }

    function toggleAnimation() {
      state.animating = !state.animating;
      state.blobs.forEach(b => b.classList.toggle('blob-animate', state.animating));
      document.getElementById('pauseIcon').style.display = state.animating ? 'block' : 'none';
      document.getElementById('playIcon').style.display = state.animating ? 'none' : 'block';
      document.getElementById('animBtnText').textContent = state.animating ? 'Pause' : 'Play';
    }

    function copyCss() {
      const bg = state.bgDark ? '#050505' : '#fafafa';
      const css = `.gradient-bg {
  position: relative;
  background: ${bg};
  overflow: hidden;
}

.gradient-bg::before,
.gradient-bg::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  filter: blur(${state.blur}px);
  opacity: ${state.opacity / 100};
}

/* Color blobs */
${state.colors.map((c, i) => `.blob-${i+1} { background: ${c}; width: ${200 + i*30}px; height: ${200 + i*30}px; }`).join('\n')}`;
      
      navigator.clipboard.writeText(css);
      showToast('CSS copied to clipboard');
    }

    async function downloadPng() {
      const preview = gradientPreview;
      const rect = preview.getBoundingClientRect();
      
      // Use html2canvas if available, otherwise simple canvas
      const canvas = document.createElement('canvas');
      canvas.width = 1920;
      canvas.height = 1200;
      const ctx = canvas.getContext('2d');
      
      // Background
      ctx.fillStyle = state.bgDark ? '#050505' : '#fafafa';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Draw blobs (simplified)
      for (const color of state.colors) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        const r = 300 + Math.random() * 200;
        
        const gradient = ctx.createRadialGradient(x, y, 0, x, y, r);
        gradient.addColorStop(0, color + Math.round(state.opacity * 2.55).toString(16).padStart(2, '0'));
        gradient.addColorStop(1, color + '00');
        
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      
      // Apply blur effect (approximate)
      ctx.filter = `blur(${state.blur / 2}px)`;
      ctx.drawImage(canvas, 0, 0);
      ctx.filter = 'none';
      
      // Download
      const link = document.createElement('a');
      link.download = 'mesh-gradient.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      
      showToast('Downloaded mesh-gradient.png');
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 2000);
    }

    // Theme
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      html.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
    }
  </script>
</body>
</html>
