        * {

        .header {

            .theme-toggle {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, background 0.2s ease;
      overflow: hidden;
    }
    
    [data-theme="dark"] .theme-toggle {
      background: rgba(0, 0, 0, 0.2);
      border-color: rgba(255, 255, 255, 0.1);
    }
    
    .theme-toggle:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.2);
    }
    
    [data-theme="dark"] .theme-toggle:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    
    .theme-toggle:active {
      transform: scale(0.95);
    }
    
    .theme-toggle-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .theme-toggle-icon svg {
      width: 20px;
      height: 20px;
    }
    
    .theme-toggle-icon .sun-icon {
      color: #facc15;
    }
    
    .theme-toggle-icon .moon-icon {
      color: #64748b;
    }
    
    [data-theme="dark"] .theme-toggle-icon {
      transform: rotate(180deg);
    }

        .main {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 0;
            min-height: calc(100vh - 65px);
        }

        @media (max-width: 900px) {
            .main {
                grid-template-columns: 1fr;
            }
        }

        .preview-area {

        .toggle-row {

        .toggle {

            width: 44px;
            height: 24px;

        .toggle input {

            width: 0;
            height: 0;

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: var(--border);
            border-radius: 12px;
            transition: 0.2s;

        .toggle-slider::before {
            content: '';
            position: absolute;
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.2s;

        .toggle input:checked + .toggle-slider {
            background: var(--accent);
        }

        .toggle input:checked + .toggle-slider::before {
            transform: translateX(20px);

        @keyframes morph {

        .blob-path.animated {
            animation: morph 4s ease-in-out infinite;
        }
    </style>

    <script>
        // State
        let state = {
            complexity: 6,
            smoothness: 50,
            size: 80,
            colorStart: '#8b5cf6',
            colorEnd: '#ec4899',
            animate: false,
            animationSpeed: 4,
            seed: Math.random()
        };

        // Elements
        const blobPath = document.getElementById('blobPath');
        const blobSvg = document.getElementById('blobSvg');
        const gradient = document.getElementById('blobGradient');

        // Generate blob path using cubic bezier curves
        function generateBlobPath(points, size, smoothness, seed) {
            const center = 200;
            const baseRadius = (size / 100) * 150;
            const angleStep = (Math.PI * 2) / points;
            
            // Create random but smooth variations
            const random = mulberry32(seed * 1000000);
            const variations = [];
            for (let i = 0; i < points; i++) {
                variations.push(0.7 + random() * 0.6);
            }

            // Generate control points
            const controlPoints = [];
            for (let i = 0; i < points; i++) {
                const angle = angleStep * i - Math.PI / 2;
                const radius = baseRadius * variations[i];
                const x = center + Math.cos(angle) * radius;
                const y = center + Math.sin(angle) * radius;
                controlPoints.push({ x, y, angle, radius });
            }

            // Build path with smooth curves
            const tension = 1 - (smoothness / 100) * 0.7;
            let path = `M ${controlPoints[0].x} ${controlPoints[0].y}`;

            for (let i = 0; i < points; i++) {
                const p0 = controlPoints[(i - 1 + points) % points];
                const p1 = controlPoints[i];
                const p2 = controlPoints[(i + 1) % points];
                const p3 = controlPoints[(i + 2) % points];

                const cp1x = p1.x + (p2.x - p0.x) / 6 * tension;
                const cp1y = p1.y + (p2.y - p0.y) / 6 * tension;
                const cp2x = p2.x - (p3.x - p1.x) / 6 * tension;
                const cp2y = p2.y - (p3.y - p1.y) / 6 * tension;

                path += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2.x} ${p2.y}`;
            }

            path += ' Z';
            return path;
        }

        // Seeded random number generator
        function mulberry32(a) {
            return function() {
                let t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        // Update blob
        function updateBlob() {
            const path = generateBlobPath(
                state.complexity,
                state.size,
                state.smoothness,
                state.seed
            );
            
            blobPath.setAttribute('d', path);
            
            // Update gradient
            gradient.children[0].setAttribute('stop-color', state.colorStart);
            gradient.children[1].setAttribute('stop-color', state.colorEnd);

            // Handle animation
            if (state.animate) {
                const path2 = generateBlobPath(
                    state.complexity,
                    state.size,
                    state.smoothness,
                    state.seed + 0.5
                );
                blobPath.style.setProperty('--path-1', `path("${path}")`);
                blobPath.style.setProperty('--path-2', `path("${path2}")`);
                blobPath.classList.add('animated');
                blobPath.style.animationDuration = `${state.animationSpeed}s`;
            } else {
                blobPath.classList.remove('animated');
            }

            updateURL();
        }

        // Event listeners for controls
        document.getElementById('complexity').addEventListener('input', (e) => {
            state.complexity = parseInt(e.target.value);
            document.getElementById('complexityValue').textContent = state.complexity;
            updateBlob();
        });

        document.getElementById('smoothness').addEventListener('input', (e) => {
            state.smoothness = parseInt(e.target.value);
            document.getElementById('smoothnessValue').textContent = `${state.smoothness}%`;
            updateBlob();
        });

        document.getElementById('size').addEventListener('input', (e) => {
            state.size = parseInt(e.target.value);
            document.getElementById('sizeValue').textContent = `${state.size}%`;
            updateBlob();
        });

        document.getElementById('colorStart').addEventListener('input', (e) => {
            state.colorStart = e.target.value;
            updatePresetSelection();
            updateBlob();
        });

        document.getElementById('colorEnd').addEventListener('input', (e) => {
            state.colorEnd = e.target.value;
            updatePresetSelection();
            updateBlob();
        });

        document.getElementById('animateToggle').addEventListener('change', (e) => {
            state.animate = e.target.checked;
            document.getElementById('animationSpeedGroup').style.display = state.animate ? 'block' : 'none';
            updateBlob();
        });

        document.getElementById('animationSpeed').addEventListener('input', (e) => {
            state.animationSpeed = parseInt(e.target.value);
            document.getElementById('animationSpeedValue').textContent = `${state.animationSpeed}s`;
            updateBlob();
        });

        // Color presets
        document.getElementById('colorPresets').addEventListener('click', (e) => {
            const preset = e.target.closest('.color-preset');
            if (!preset) return;
            
            state.colorStart = preset.dataset.start;
            state.colorEnd = preset.dataset.end;
            document.getElementById('colorStart').value = state.colorStart;
            document.getElementById('colorEnd').value = state.colorEnd;
            updatePresetSelection();
            updateBlob();
        });

        function updatePresetSelection() {
            document.querySelectorAll('.color-preset').forEach(p => {
                const matches = p.dataset.start.toLowerCase() === state.colorStart.toLowerCase() &&
                               p.dataset.end.toLowerCase() === state.colorEnd.toLowerCase();
                p.classList.toggle('active', matches);
            });
        }

        // Randomize
        document.getElementById('randomizeBtn').addEventListener('click', () => {
            state.seed = Math.random();
            state.complexity = 3 + Math.floor(Math.random() * 10);
            state.smoothness = 20 + Math.floor(Math.random() * 60);
            
            // Update UI
            document.getElementById('complexity').value = state.complexity;
            document.getElementById('complexityValue').textContent = state.complexity;
            document.getElementById('smoothness').value = state.smoothness;
            document.getElementById('smoothnessValue').textContent = `${state.smoothness}%`;
            
            // Random color preset
            const presets = document.querySelectorAll('.color-preset');
            const randomPreset = presets[Math.floor(Math.random() * presets.length)];
            state.colorStart = randomPreset.dataset.start;
            state.colorEnd = randomPreset.dataset.end;
            document.getElementById('colorStart').value = state.colorStart;
            document.getElementById('colorEnd').value = state.colorEnd;
            updatePresetSelection();
            
            updateBlob();
        });

        // Export functions
        document.getElementById('downloadSvg').addEventListener('click', () => {
            const svgContent = blobSvg.outerHTML;
            const blob = new Blob([svgContent], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'blob.svg';
            a.click();
            URL.revokeObjectURL(url);
        });

        document.getElementById('downloadPng').addEventListener('click', () => {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            
            const svgData = new XMLSerializer().serializeToString(blobSvg);
            const img = new Image();
            
            img.onload = () => {
                ctx.drawImage(img, 0, 0, 1024, 1024);
                const a = document.createElement('a');
                a.href = canvas.toDataURL('image/png');
                a.download = 'blob.png';
                a.click();
            };
            
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
        });

        document.getElementById('copyCss').addEventListener('click', () => {
            const svgData = new XMLSerializer().serializeToString(blobSvg);
            const base64 = btoa(unescape(encodeURIComponent(svgData)));
            const css = `background-image: url("data:image/svg+xml;base64,${base64}");
background-repeat: no-repeat;
background-position: center;
background-size: contain;`;
            
            navigator.clipboard.writeText(css);
            showToast('CSS copied!');
        });

        document.getElementById('shareLink').addEventListener('click', () => {
            const url = new URL(window.location.href);
            url.search = '';
            url.searchParams.set('c', state.complexity);
            url.searchParams.set('sm', state.smoothness);
            url.searchParams.set('sz', state.size);
            url.searchParams.set('cs', state.colorStart.slice(1));
            url.searchParams.set('ce', state.colorEnd.slice(1));
            url.searchParams.set('s', Math.round(state.seed * 100000));
            url.searchParams.set('a', state.animate ? 1 : 0);
            if (state.animate) {
                url.searchParams.set('as', state.animationSpeed);
            }
            
            navigator.clipboard.writeText(url.toString());
            showToast('Link copied!');
        });

        function updateURL() {
            const url = new URL(window.location.href);
            url.searchParams.set('c', state.complexity);
            url.searchParams.set('sm', state.smoothness);
            url.searchParams.set('sz', state.size);
            url.searchParams.set('cs', state.colorStart.slice(1));
            url.searchParams.set('ce', state.colorEnd.slice(1));
            url.searchParams.set('s', Math.round(state.seed * 100000));
            url.searchParams.set('a', state.animate ? 1 : 0);
            if (state.animate) {
                url.searchParams.set('as', state.animationSpeed);
            }
            history.replaceState(null, '', url.toString());
        }

        // Toast
        function showToast(message) {
            const toast = document.getElementById('copyToast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Theme toggle
        document.getElementById('themeToggle').addEventListener('click', () => {
            const isDark = document.body.hasAttribute('data-theme');
            if (isDark) {
                document.body.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                document.body.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        });

        // Load theme
        if (localStorage.getItem('theme') === 'dark' || 
            (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.body.setAttribute('data-theme', 'dark');
        }

        // Load state from URL
        function loadFromURL() {
            const params = new URLSearchParams(window.location.search);
            
            if (params.has('c')) state.complexity = parseInt(params.get('c'));
            if (params.has('sm')) state.smoothness = parseInt(params.get('sm'));
            if (params.has('sz')) state.size = parseInt(params.get('sz'));
            if (params.has('cs')) state.colorStart = '#' + params.get('cs');
            if (params.has('ce')) state.colorEnd = '#' + params.get('ce');
            if (params.has('s')) state.seed = parseInt(params.get('s')) / 100000;
            if (params.has('a')) state.animate = params.get('a') === '1';
            if (params.has('as')) state.animationSpeed = parseInt(params.get('as'));

            // Update UI
            document.getElementById('complexity').value = state.complexity;
            document.getElementById('complexityValue').textContent = state.complexity;
            document.getElementById('smoothness').value = state.smoothness;
            document.getElementById('smoothnessValue').textContent = `${state.smoothness}%`;
            document.getElementById('size').value = state.size;
            document.getElementById('sizeValue').textContent = `${state.size}%`;
            document.getElementById('colorStart').value = state.colorStart;
            document.getElementById('colorEnd').value = state.colorEnd;
            document.getElementById('animateToggle').checked = state.animate;
            document.getElementById('animationSpeedGroup').style.display = state.animate ? 'block' : 'none';
            document.getElementById('animationSpeed').value = state.animationSpeed;
            document.getElementById('animationSpeedValue').textContent = `${state.animationSpeed}s`;
            updatePresetSelection();
        }

        // Initialize
        loadFromURL();
        updateBlob();
    </script>
</body>
</html>
