<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="4" fill="#6366f1" fill-opacity="0.6"/>
    </pattern>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e0e0"/>
    </linearGradient>
  </defs>
  
  <!-- Background with pattern -->
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  
  <!-- Content -->
  <text x="100" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="white">SVG Pattern Generator</text>
  <text x="100" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="rgba(255,255,255,0.7)">Dots • Lines • Grids • Waves • 12 patterns</text>
  
  <!-- Logo -->
  <g transform="translate(100, 480)">
    <rect width="48" height="48" rx="10" fill="url(#logoGrad)"/>
    <path d="M14 34L24 14L34 34" stroke="#6366f1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="24" cy="28" r="3" fill="#6366f1"/>
  </g>
  <text x="160" y="515" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="white">Alkemist</text>
  
  <!-- URL -->
  <text x="1100" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="rgba(255,255,255,0.5)" text-anchor="end">day036.aikemist.com</text>
</svg>
