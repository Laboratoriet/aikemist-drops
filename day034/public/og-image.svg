<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Sample buttons -->
  <rect x="150" y="220" width="180" height="56" rx="8" fill="#3b82f6"/>
  <text x="240" y="256" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">Get Started</text>
  
  <rect x="370" y="220" width="180" height="56" rx="28" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <text x="460" y="256" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#8b5cf6" text-anchor="middle">Sign Up</text>
  
  <rect x="590" y="220" width="180" height="56" rx="8" fill="url(#accent)"/>
  <text x="680" y="256" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">Learn More</text>
  
  <rect x="810" y="220" width="180" height="56" rx="0" fill="#22c55e"/>
  <text x="900" y="256" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">Download</text>
  
  <!-- Title -->
  <text x="600" y="400" font-family="system-ui, sans-serif" font-size="48" font-weight="700" fill="white" text-anchor="middle">Button Generator</text>
  <text x="600" y="450" font-family="system-ui, sans-serif" font-size="24" fill="#a1a1a1" text-anchor="middle">Create beautiful CSS buttons visually</text>
  
  <!-- Branding -->
  <text x="600" y="560" font-family="system-ui, sans-serif" font-size="18" fill="#666" text-anchor="middle">aikemist.com</text>
