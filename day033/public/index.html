<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox Generator — Visual CSS Flexbox Builder | Alkemist</title>
  <meta name="description" content="Build CSS flexbox layouts visually. Presets for common patterns, full control over container and items, instant CSS output.">
  <meta property="og:title" content="Flexbox Generator — Visual CSS Flexbox Builder">
  <meta property="og:description" content="Build CSS flexbox layouts visually. Presets, live preview, copy CSS.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://day033.aikemist.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg: #fafafa;
      --bg-card: #ffffff;
      --text: #1a1a1a;
      --text-muted: #666666;
      --border: #e5e5e5;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --preview-bg: #f0f0f0;
      --item-1: #6366f1;
      --item-2: #8b5cf6;
      --item-3: #a855f7;
      --item-4: #d946ef;
      --item-5: #ec4899;
      --item-6: #f43f5e;
    }
    
    [data-theme="dark"] {
      --bg: #0a0a0a;
      --bg-card: #141414;
      --text: #f5f5f5;
      --text-muted: #a3a3a3;
      --border: #2a2a2a;
      --preview-bg: #1a1a1a;
    }
    
    body {
      font-family: 'Jost', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    
    /* Header */
    .header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text);
    }
    
    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--item-1), var(--item-3));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
      font-size: 1.1rem;
    }
    
    .logo-text {
      font-weight: 600;
      font-size: 1.25rem;
    }
    
    .header-actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }
    
    .theme-toggle {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem;
      cursor: pointer;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    
    .theme-toggle:hover {
      border-color: var(--accent);
    }
    
    /* Main Layout */
    .main {
      display: grid;
      grid-template-columns: 300px 1fr 320px;
      min-height: calc(100vh - 73px - 60px);
    }
    
    @media (max-width: 1200px) {
      .main {
        grid-template-columns: 1fr;
      }
    }
    
    /* Panels */
    .panel {
      padding: 1.5rem;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      background: var(--bg-card);
    }
    
    .panel:last-child {
      border-right: none;
    }
    
    .panel-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
    
    /* Presets */
    .presets {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    
    .preset-btn {
      padding: 0.625rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text);
      transition: all 0.2s;
      text-align: left;
    }
    
    .preset-btn:hover {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }
    
    .preset-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    
    /* Control Groups */
    .control-group {
      margin-bottom: 1.25rem;
    }
    
    .control-label {
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .control-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent);
    }
    
    /* Select */
    .select-wrap {
      position: relative;
    }
    
    .select {
      width: 100%;
      padding: 0.625rem 2rem 0.625rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.875rem;
      color: var(--text);
      cursor: pointer;
      appearance: none;
      transition: border-color 0.2s;
    }
    
    .select:hover, .select:focus {
      border-color: var(--accent);
      outline: none;
    }
    
    .select-wrap::after {
      content: '▾';
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-muted);
      font-size: 0.75rem;
    }
    
    /* Input */
    .input {
      width: 100%;
      padding: 0.625rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.875rem;
      color: var(--text);
      transition: border-color 0.2s;
    }
    
    .input:hover, .input:focus {
      border-color: var(--accent);
      outline: none;
    }
    
    /* Button Row */
    .button-row {
      display: flex;
      gap: 0.5rem;
    }
    
    .button-row .select-wrap {
      flex: 1;
    }
    
    /* Items Control */
    .items-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    
    .items-count {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .count-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    
    .count-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    
    .count-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .count-display {
      font-weight: 600;
      min-width: 24px;
      text-align: center;
    }
    
    /* Item Settings */
    .item-settings {
      background: var(--bg);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    
    .item-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    
    .item-color {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }
    
    .item-name {
      font-weight: 600;
      font-size: 0.875rem;
    }
    
    .item-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    
    .item-control {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    
    .item-control label {
      font-size: 0.7rem;
      color: var(--text-muted);
    }
    
    .item-control input, .item-control select {
      padding: 0.375rem 0.5rem;
      font-size: 0.75rem;
    }
    
    /* Preview Panel */
    .preview-panel {
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }
    
    .preview-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: var(--preview-bg);
      border-radius: 12px;
      margin: 1rem;
    }
    
    .flex-container {
      display: flex;
      background: rgba(99, 102, 241, 0.1);
      border: 2px dashed var(--accent);
      border-radius: 8px;
      min-height: 300px;
      width: 100%;
      max-width: 500px;
      padding: 8px;
      transition: all 0.3s ease;
    }
    
    .flex-item {
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 0.875rem;
      border-radius: 6px;
      min-width: 50px;
      min-height: 50px;
      padding: 0.5rem;
      transition: all 0.3s ease;
    }
    
    /* Code Panel */
    .code-panel {
      background: var(--bg-card);
    }
    
    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    
    .copy-btn {
      padding: 0.5rem 1rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .copy-btn:hover {
      background: var(--accent-hover);
    }
    
    .copy-btn.copied {
      background: #10b981;
    }
    
    .code-block {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      line-height: 1.6;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 400px;
      overflow-y: auto;
    }
    
    .code-block .property {
      color: #6366f1;
    }
    
    .code-block .value {
      color: #10b981;
    }
    
    .code-block .selector {
      color: #f59e0b;
    }
    
    .code-block .comment {
      color: var(--text-muted);
    }
    
    /* Share Link */
    .share-section {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }
    
    .share-input-wrap {
      display: flex;
      gap: 0.5rem;
    }
    
    .share-input {
      flex: 1;
      padding: 0.625rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--text);
    }
    
    .share-btn {
      padding: 0.625rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      color: var(--text);
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    
    .share-btn:hover {
      border-color: var(--accent);
    }
    
    /* Footer */
    .footer {
      padding: 1rem 2rem;
      text-align: center;
      border-top: 1px solid var(--border);
      background: var(--bg-card);
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    
    .footer a {
      color: var(--text);
      text-decoration: none;
      transition: color 0.2s;
    }
    
    .footer a:hover {
      color: var(--accent);
    }
    
    /* Responsive */
    @media (max-width: 1200px) {
      .main {
        display: flex;
        flex-direction: column;
      }
      
      .panel {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      
      .preview-panel {
        min-height: 400px;
      }
    }
    
    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text);
      color: var(--bg);
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.875rem;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
    }
    
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <header class="header">
    <a href="https://aikemist.com" class="logo">
      <div class="logo-icon">F</div>
      <span class="logo-text">Flexbox Generator</span>
    </a>
    <div class="header-actions">
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </div>
  </header>
  
  <main class="main">
    <!-- Container Controls -->
    <div class="panel">
      <div class="panel-title">Presets</div>
      <div class="presets">
        <button class="preset-btn" onclick="applyPreset('center')">Center</button>
        <button class="preset-btn" onclick="applyPreset('spaceBetween')">Space Between</button>
        <button class="preset-btn" onclick="applyPreset('navbar')">Navbar</button>
        <button class="preset-btn" onclick="applyPreset('cards')">Cards</button>
        <button class="preset-btn" onclick="applyPreset('sidebar')">Sidebar</button>
        <button class="preset-btn" onclick="applyPreset('stack')">Stack</button>
        <button class="preset-btn" onclick="applyPreset('holy')">Holy Grail</button>
        <button class="preset-btn" onclick="applyPreset('masonry')">Masonry-ish</button>
      </div>
      
      <div class="panel-title">Container</div>
      
      <div class="control-group">
        <div class="control-label">flex-direction</div>
        <div class="select-wrap">
          <select class="select" id="flexDirection" onchange="updatePreview()">
            <option value="row">row</option>
            <option value="row-reverse">row-reverse</option>
            <option value="column">column</option>
            <option value="column-reverse">column-reverse</option>
          </select>
        </div>
      </div>
      
      <div class="control-group">
        <div class="control-label">flex-wrap</div>
        <div class="select-wrap">
          <select class="select" id="flexWrap" onchange="updatePreview()">
            <option value="nowrap">nowrap</option>
            <option value="wrap">wrap</option>
            <option value="wrap-reverse">wrap-reverse</option>
          </select>
        </div>
      </div>
      
      <div class="control-group">
        <div class="control-label">justify-content</div>
        <div class="select-wrap">
          <select class="select" id="justifyContent" onchange="updatePreview()">
            <option value="flex-start">flex-start</option>
            <option value="flex-end">flex-end</option>
            <option value="center">center</option>
            <option value="space-between">space-between</option>
            <option value="space-around">space-around</option>
            <option value="space-evenly">space-evenly</option>
          </select>
        </div>
      </div>
      
      <div class="control-group">
        <div class="control-label">align-items</div>
        <div class="select-wrap">
          <select class="select" id="alignItems" onchange="updatePreview()">
            <option value="stretch">stretch</option>
            <option value="flex-start">flex-start</option>
            <option value="flex-end">flex-end</option>
            <option value="center">center</option>
            <option value="baseline">baseline</option>
          </select>
        </div>
      </div>
      
      <div class="control-group">
        <div class="control-label">align-content</div>
        <div class="select-wrap">
          <select class="select" id="alignContent" onchange="updatePreview()">
            <option value="stretch">stretch</option>
            <option value="flex-start">flex-start</option>
            <option value="flex-end">flex-end</option>
            <option value="center">center</option>
            <option value="space-between">space-between</option>
            <option value="space-around">space-around</option>
          </select>
        </div>
      </div>
      
      <div class="control-group">
        <div class="control-label">
          gap
          <span class="control-value" id="gapValue">12px</span>
        </div>
        <input type="range" class="input" id="gap" min="0" max="48" value="12" oninput="updatePreview()">
      </div>
    </div>
    
    <!-- Preview -->
    <div class="panel preview-panel">
      <div class="panel-title">Preview</div>
      <div class="preview-container">
        <div class="flex-container" id="flexContainer">
          <!-- Items rendered by JS -->
        </div>
      </div>
    </div>
    
    <!-- Items + Code -->
    <div class="panel code-panel">
      <div class="items-header">
        <div class="panel-title" style="margin-bottom: 0">Items</div>
        <div class="items-count">
          <button class="count-btn" onclick="changeItemCount(-1)" id="decreaseBtn">−</button>
          <span class="count-display" id="itemCountDisplay">4</span>
          <button class="count-btn" onclick="changeItemCount(1)" id="increaseBtn">+</button>
        </div>
      </div>
      
      <div id="itemsContainer">
        <!-- Items controls rendered by JS -->
      </div>
      
      <div class="code-header" style="margin-top: 1.5rem">
        <div class="panel-title" style="margin-bottom: 0">CSS Output</div>
        <button class="copy-btn" onclick="copyCSS()">Copy CSS</button>
      </div>
      <div class="code-block" id="codeOutput"></div>
      
      <div class="share-section">
        <div class="control-label">Share Link</div>
        <div class="share-input-wrap">
          <input type="text" class="share-input" id="shareInput" readonly>
          <button class="share-btn" onclick="copyShareLink()">Copy</button>
        </div>
      </div>
    </div>
  </main>
  
  <footer class="footer">
    <a href="https://aikemist.com">aikemist.com</a> · Made by <a href="https://alkemist.no">Alkemist</a>
  </footer>
  
  <div class="toast" id="toast"></div>
  
  <script>
    const itemColors = [
      '#6366f1', '#8b5cf6', '#a855f7', '#d946ef', '#ec4899', '#f43f5e',
      '#f97316', '#eab308', '#22c55e', '#14b8a6'
    ];
    
    let items = [
      { grow: 0, shrink: 1, basis: 'auto', alignSelf: 'auto', order: 0 },
      { grow: 0, shrink: 1, basis: 'auto', alignSelf: 'auto', order: 0 },
      { grow: 0, shrink: 1, basis: 'auto', alignSelf: 'auto', order: 0 },
      { grow: 0, shrink: 1, basis: 'auto', alignSelf: 'auto', order: 0 }
    ];
    
    const presets = {
      center: {
        direction: 'row', wrap: 'nowrap', justify: 'center', alignItems: 'center', alignContent: 'stretch', gap: 12,
        items: [
          { grow: 0, shrink: 1, basis: 'auto', alignSelf: 'auto', order: 0 }
        ]
      },
      spaceBetween: {
        direction: 'row', wrap: 'nowrap', justify: 'space-between', alignItems: 'center', alignContent: 'stretch', gap: 12,
        items: [
          { grow: 0, shrink: 1, basis: 'auto', alignSelf: 'auto', order: 0 },
          { grow: 0, shrink: 1, basis: 'auto', alignSelf: 'auto', order: 0 },
          { grow: 0, shrink: 1, basis: 'auto', alignSelf: 'auto', order: 0 }
        ]
      },
      navbar: {
        direction: 'row', wrap: 'nowrap', justify: 'space-between', alignItems: 'center', alignContent: 'stretch', gap: 16,
        items: [
          { grow: 0, shrink: 0, basis: '120px', alignSelf: 'auto', order: 0 },
          { grow: 1, shrink: 1, basis: 'auto', alignSelf: 'auto', order: 0 },
          { grow: 0, shrink: 0, basis: '80px', alignSelf: 'auto', order: 0 }
        ]
      },
      cards: {
        direction: 'row', wrap: 'wrap', justify: 'flex-start', alignItems: 'stretch', alignContent: 'flex-start', gap: 16,
        items: [
          { grow: 0, shrink: 0, basis: '150px', alignSelf: 'auto', order: 0 },
          { grow: 0, shrink: 0, basis: '150px', alignSelf: 'auto', order: 0 },
          { grow: 0, shrink: 0, basis: '150px', alignSelf: 'auto', order: 0 },
          { grow: 0, shrink: 0, basis: '150px', alignSelf: 'auto', order: 0 },
          { grow: 0, shrink: 0, basis: '150px', alignSelf: 'auto', order: 0 },
          { grow: 0, shrink: 0, basis: '150px', alignSelf: 'auto', order: 0 }
        ]
      },
      sidebar: {
        direction: 'row', wrap: 'nowrap', justify: 'flex-start', alignItems: 'stretch', alignContent: 'stretch', gap: 0,
        items: [
          { grow: 0, shrink: 0, basis: '200px', alignSelf: 'auto', order: 0 },
          { grow: 1, shrink: 1, basis: 'auto', alignSelf: 'auto', order: 0 }
        ]
      },
      stack: {
        direction: 'column', wrap: 'nowrap', justify: 'flex-start', alignItems: 'stretch', alignContent: 'stretch', gap: 12,
        items: [
          { grow: 0, shrink: 1, basis: 'auto', alignSelf: 'auto', order: 0 },
          { grow: 0, shrink: 1, basis: 'auto', alignSelf: 'auto', order: 0 },
          { grow: 0, shrink: 1, basis: 'auto', alignSelf: 'auto', order: 0 }
        ]
      },
      holy: {
        direction: 'row', wrap: 'wrap', justify: 'flex-start', alignItems: 'stretch', alignContent: 'stretch', gap: 0,
        items: [
          { grow: 0, shrink: 0, basis: '100%', alignSelf: 'auto', order: 0 },
          { grow: 0, shrink: 0, basis: '150px', alignSelf: 'auto', order: 0 },
          { grow: 1, shrink: 1, basis: '0', alignSelf: 'auto', order: 0 },
          { grow: 0, shrink: 0, basis: '150px', alignSelf: 'auto', order: 0 },
          { grow: 0, shrink: 0, basis: '100%', alignSelf: 'auto', order: 0 }
        ]
      },
      masonry: {
        direction: 'column', wrap: 'wrap', justify: 'flex-start', alignItems: 'flex-start', alignContent: 'flex-start', gap: 8,
        items: [
          { grow: 0, shrink: 0, basis: '80px', alignSelf: 'auto', order: 0 },
          { grow: 0, shrink: 0, basis: '120px', alignSelf: 'auto', order: 0 },
          { grow: 0, shrink: 0, basis: '60px', alignSelf: 'auto', order: 0 },
          { grow: 0, shrink: 0, basis: '100px', alignSelf: 'auto', order: 0 },
          { grow: 0, shrink: 0, basis: '90px', alignSelf: 'auto', order: 0 }
        ]
      }
    };
    
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
      localStorage.setItem('theme', current === 'dark' ? 'light' : 'dark');
    }
    
    function applyPreset(name) {
      const preset = presets[name];
      if (!preset) return;
      
      document.getElementById('flexDirection').value = preset.direction;
      document.getElementById('flexWrap').value = preset.wrap;
      document.getElementById('justifyContent').value = preset.justify;
      document.getElementById('alignItems').value = preset.alignItems;
      document.getElementById('alignContent').value = preset.alignContent;
      document.getElementById('gap').value = preset.gap;
      
      items = preset.items.map(item => ({ ...item }));
      
      // Update preset buttons
      document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      
      renderItemControls();
      updatePreview();
    }
    
    function changeItemCount(delta) {
      const newCount = items.length + delta;
      if (newCount < 1 || newCount > 10) return;
      
      if (delta > 0) {
        items.push({ grow: 0, shrink: 1, basis: 'auto', alignSelf: 'auto', order: 0 });
      } else {
        items.pop();
      }
      
      document.getElementById('decreaseBtn').disabled = items.length <= 1;
      document.getElementById('increaseBtn').disabled = items.length >= 10;
      
      renderItemControls();
      updatePreview();
    }
    
    function renderItemControls() {
      const container = document.getElementById('itemsContainer');
      document.getElementById('itemCountDisplay').textContent = items.length;
      
      container.innerHTML = items.map((item, i) => `
        <div class="item-settings">
          <div class="item-header">
            <div class="item-color" style="background: ${itemColors[i % itemColors.length]}"></div>
            <span class="item-name">Item ${i + 1}</span>
          </div>
          <div class="item-controls">
            <div class="item-control">
              <label>flex-grow</label>
              <input type="number" class="input" value="${item.grow}" min="0" max="10" 
                onchange="updateItem(${i}, 'grow', this.value)">
            </div>
            <div class="item-control">
              <label>flex-shrink</label>
              <input type="number" class="input" value="${item.shrink}" min="0" max="10"
                onchange="updateItem(${i}, 'shrink', this.value)">
            </div>
            <div class="item-control">
              <label>flex-basis</label>
              <input type="text" class="input" value="${item.basis}"
                onchange="updateItem(${i}, 'basis', this.value)">
            </div>
            <div class="item-control">
              <label>align-self</label>
              <select class="select" onchange="updateItem(${i}, 'alignSelf', this.value)">
                <option value="auto" ${item.alignSelf === 'auto' ? 'selected' : ''}>auto</option>
                <option value="flex-start" ${item.alignSelf === 'flex-start' ? 'selected' : ''}>flex-start</option>
                <option value="flex-end" ${item.alignSelf === 'flex-end' ? 'selected' : ''}>flex-end</option>
                <option value="center" ${item.alignSelf === 'center' ? 'selected' : ''}>center</option>
                <option value="stretch" ${item.alignSelf === 'stretch' ? 'selected' : ''}>stretch</option>
              </select>
            </div>
          </div>
        </div>
      `).join('');
    }
    
    function updateItem(index, property, value) {
      if (property === 'grow' || property === 'shrink') {
        items[index][property] = parseInt(value) || 0;
      } else {
        items[index][property] = value;
      }
      updatePreview();
    }
    
    function updatePreview() {
      const container = document.getElementById('flexContainer');
      const direction = document.getElementById('flexDirection').value;
      const wrap = document.getElementById('flexWrap').value;
      const justify = document.getElementById('justifyContent').value;
      const alignItems = document.getElementById('alignItems').value;
      const alignContent = document.getElementById('alignContent').value;
      const gap = document.getElementById('gap').value;
      
      document.getElementById('gapValue').textContent = gap + 'px';
      
      container.style.flexDirection = direction;
      container.style.flexWrap = wrap;
      container.style.justifyContent = justify;
      container.style.alignItems = alignItems;
      container.style.alignContent = alignContent;
      container.style.gap = gap + 'px';
      
      // Render items
      container.innerHTML = items.map((item, i) => {
        const basis = item.basis === 'auto' ? 'auto' : item.basis;
        return `<div class="flex-item" style="
          background: ${itemColors[i % itemColors.length]};
          flex-grow: ${item.grow};
          flex-shrink: ${item.shrink};
          flex-basis: ${basis};
          align-self: ${item.alignSelf};
          order: ${item.order};
        ">${i + 1}</div>`;
      }).join('');
      
      updateCode();
      updateShareLink();
    }
    
    function updateCode() {
      const direction = document.getElementById('flexDirection').value;
      const wrap = document.getElementById('flexWrap').value;
      const justify = document.getElementById('justifyContent').value;
      const alignItems = document.getElementById('alignItems').value;
      const alignContent = document.getElementById('alignContent').value;
      const gap = document.getElementById('gap').value;
      
      let css = `<span class="selector">.container</span> {
  <span class="property">display</span>: <span class="value">flex</span>;
  <span class="property">flex-direction</span>: <span class="value">${direction}</span>;
  <span class="property">flex-wrap</span>: <span class="value">${wrap}</span>;
  <span class="property">justify-content</span>: <span class="value">${justify}</span>;
  <span class="property">align-items</span>: <span class="value">${alignItems}</span>;`;
      
      if (wrap !== 'nowrap') {
        css += `
  <span class="property">align-content</span>: <span class="value">${alignContent}</span>;`;
      }
      
      css += `
  <span class="property">gap</span>: <span class="value">${gap}px</span>;
}`;
      
      // Item styles (only if non-default)
      items.forEach((item, i) => {
        const hasCustomStyles = item.grow !== 0 || item.shrink !== 1 || item.basis !== 'auto' || item.alignSelf !== 'auto';
        if (hasCustomStyles) {
          css += `

<span class="selector">.item-${i + 1}</span> {`;
          if (item.grow !== 0) css += `
  <span class="property">flex-grow</span>: <span class="value">${item.grow}</span>;`;
          if (item.shrink !== 1) css += `
  <span class="property">flex-shrink</span>: <span class="value">${item.shrink}</span>;`;
          if (item.basis !== 'auto') css += `
  <span class="property">flex-basis</span>: <span class="value">${item.basis}</span>;`;
          if (item.alignSelf !== 'auto') css += `
  <span class="property">align-self</span>: <span class="value">${item.alignSelf}</span>;`;
          css += `
}`;
        }
      });
      
      document.getElementById('codeOutput').innerHTML = css;
    }
    
    function getPlainCSS() {
      const direction = document.getElementById('flexDirection').value;
      const wrap = document.getElementById('flexWrap').value;
      const justify = document.getElementById('justifyContent').value;
      const alignItems = document.getElementById('alignItems').value;
      const alignContent = document.getElementById('alignContent').value;
      const gap = document.getElementById('gap').value;
      
      let css = `.container {
  display: flex;
  flex-direction: ${direction};
  flex-wrap: ${wrap};
  justify-content: ${justify};
  align-items: ${alignItems};`;
      
      if (wrap !== 'nowrap') {
        css += `
  align-content: ${alignContent};`;
      }
      
      css += `
  gap: ${gap}px;
}`;
      
      items.forEach((item, i) => {
        const hasCustomStyles = item.grow !== 0 || item.shrink !== 1 || item.basis !== 'auto' || item.alignSelf !== 'auto';
        if (hasCustomStyles) {
          css += `

.item-${i + 1} {`;
          if (item.grow !== 0) css += `
  flex-grow: ${item.grow};`;
          if (item.shrink !== 1) css += `
  flex-shrink: ${item.shrink};`;
          if (item.basis !== 'auto') css += `
  flex-basis: ${item.basis};`;
          if (item.alignSelf !== 'auto') css += `
  align-self: ${item.alignSelf};`;
          css += `
}`;
        }
      });
      
      return css;
    }
    
    function copyCSS() {
      const css = getPlainCSS();
      navigator.clipboard.writeText(css);
      
      const btn = document.querySelector('.copy-btn');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'Copy CSS';
        btn.classList.remove('copied');
      }, 2000);
    }
    
    function updateShareLink() {
      const state = {
        d: document.getElementById('flexDirection').value,
        w: document.getElementById('flexWrap').value,
        j: document.getElementById('justifyContent').value,
        ai: document.getElementById('alignItems').value,
        ac: document.getElementById('alignContent').value,
        g: document.getElementById('gap').value,
        i: items.map(item => [item.grow, item.shrink, item.basis, item.alignSelf])
      };
      
      const encoded = btoa(JSON.stringify(state));
      const url = `${window.location.origin}${window.location.pathname}?s=${encoded}`;
      document.getElementById('shareInput').value = url;
    }
    
    function loadFromURL() {
      const params = new URLSearchParams(window.location.search);
      const encoded = params.get('s');
      if (!encoded) return false;
      
      try {
        const state = JSON.parse(atob(encoded));
        document.getElementById('flexDirection').value = state.d;
        document.getElementById('flexWrap').value = state.w;
        document.getElementById('justifyContent').value = state.j;
        document.getElementById('alignItems').value = state.ai;
        document.getElementById('alignContent').value = state.ac;
        document.getElementById('gap').value = state.g;
        
        items = state.i.map(arr => ({
          grow: arr[0],
          shrink: arr[1],
          basis: arr[2],
          alignSelf: arr[3],
          order: 0
        }));
        
        return true;
      } catch (e) {
        return false;
      }
    }
    
    function copyShareLink() {
      const input = document.getElementById('shareInput');
      navigator.clipboard.writeText(input.value);
      showToast('Link copied!');
    }
    
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    
    // Init
    document.addEventListener('DOMContentLoaded', () => {
      // Theme
      const savedTheme = localStorage.getItem('theme') || 
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', savedTheme);
      
      // Load from URL or default
      if (!loadFromURL()) {
        // Default state already set
      }
      
      renderItemControls();
      updatePreview();
    });
  </script>
</body>
</html>
