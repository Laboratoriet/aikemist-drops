<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Line Sorter & Tools | aikemist.com</title>
  <meta name="description" content="Sort lines alphabetically, remove duplicates, reverse order, add line numbers, and more.">
  <meta property="og:title" content="Line Sorter & Tools">
  <meta property="og:description" content="Sort lines alphabetically, remove duplicates, reverse order, add line numbers, and more.">
  <meta property="og:image" content="https://day061.aikemist.com/og.png">
  <meta property="og:url" content="https://day061.aikemist.com">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg: #fafafa;
      --bg-card: #ffffff;
      --text: #1a1a2e;
      --text-muted: #6b7280;
      --accent: #06b6d4;
      --accent-hover: #0891b2;
      --accent-soft: rgba(6, 182, 212, 0.1);
      --border: #e5e7eb;
      --input-bg: #f9fafb;
      --success: #10b981;
    }
    
    [data-theme="dark"] {
      --bg: #0a0a0f;
      --bg-card: #12121a;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --input-bg: #1e1e2e;
    }
    
    body {
      font-family: 'Jost', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      transition: background 0.3s, color 0.3s;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--accent), #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .tagline {
      color: var(--text-muted);
      font-size: 1.1rem;
    }
    
    .theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      cursor: pointer;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
      z-index: 100;
    }
    
    .theme-toggle:hover { transform: scale(1.1); }
    
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    
    /* Tool Buttons */
    .tools-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    
    .tool-btn {
      font-family: 'Jost', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.625rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }
    
    .tool-btn:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
      transform: translateY(-1px);
    }
    
    .tool-btn:active { transform: translateY(0); }
    
    .tool-icon { font-size: 1rem; }
    
    /* Textarea */
    .textarea-group {
      margin-bottom: 1rem;
    }
    
    .textarea-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    
    .textarea-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }
    
    .stats {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-muted);
      display: flex;
      gap: 1rem;
    }
    
    textarea {
      width: 100%;
      min-height: 250px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--input-bg);
      color: var(--text);
      resize: vertical;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    
    /* Actions */
    .actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    
    .action-btn {
      font-family: 'Jost', sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .action-btn:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    
    .action-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    
    .action-btn.primary:hover {
      background: var(--accent-hover);
    }
    
    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text);
      color: var(--bg);
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 0.875rem;
      opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
      z-index: 1000;
    }
    
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    
    /* Footer */
    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-muted);
      font-size: 0.875rem;
    }
    
    footer a {
      color: var(--accent);
      text-decoration: none;
    }
    
    footer a:hover { text-decoration: underline; }
    
    .keyboard-hints {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 1rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    
    kbd {
      font-family: 'JetBrains Mono', monospace;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.125rem 0.375rem;
      font-size: 0.7rem;
    }
    
    @media (max-width: 600px) {
      h1 { font-size: 1.75rem; }
      .container { padding: 1rem; }
      .card { padding: 1rem; }
      textarea { min-height: 180px; }
      .keyboard-hints { display: none; }
      .tool-btn { font-size: 0.8rem; padding: 0.5rem 0.75rem; }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
  
  <div class="container">
    <header>
      <h1>Line Sorter & Tools</h1>
      <p class="tagline">Sort, dedupe, reverse, shuffle, and transform lines of text.</p>
    </header>
    
    <div class="card">
      <!-- Tools -->
      <div class="tools-grid">
        <button class="tool-btn" data-action="sort-asc">
          <span class="tool-icon">↑</span> Sort A→Z
        </button>
        <button class="tool-btn" data-action="sort-desc">
          <span class="tool-icon">↓</span> Sort Z→A
        </button>
        <button class="tool-btn" data-action="sort-num">
          <span class="tool-icon">#</span> Sort Numbers
        </button>
        <button class="tool-btn" data-action="reverse">
          <span class="tool-icon">⇅</span> Reverse
        </button>
        <button class="tool-btn" data-action="shuffle">
          <span class="tool-icon">🎲</span> Shuffle
        </button>
        <button class="tool-btn" data-action="dedupe">
          <span class="tool-icon">✂</span> Remove Duplicates
        </button>
        <button class="tool-btn" data-action="trim">
          <span class="tool-icon">⌫</span> Trim Whitespace
        </button>
        <button class="tool-btn" data-action="empty">
          <span class="tool-icon">−</span> Remove Empty
        </button>
        <button class="tool-btn" data-action="numbers">
          <span class="tool-icon">1.</span> Add Line Numbers
        </button>
        <button class="tool-btn" data-action="prefix">
          <span class="tool-icon">→</span> Add Prefix
        </button>
        <button class="tool-btn" data-action="suffix">
          <span class="tool-icon">←</span> Add Suffix
        </button>
        <button class="tool-btn" data-action="wrap">
          <span class="tool-icon">" "</span> Wrap Lines
        </button>
      </div>
      
      <!-- Textarea -->
      <div class="textarea-group">
        <div class="textarea-header">
          <span class="textarea-label">Your Text</span>
          <div class="stats">
            <span><span id="lineCount">0</span> lines</span>
            <span><span id="charCount">0</span> chars</span>
            <span><span id="uniqueCount">0</span> unique</span>
          </div>
        </div>
        <textarea id="textArea" placeholder="Paste your lines here...
apple
banana
cherry
apple
date"></textarea>
      </div>
      
      <!-- Actions -->
      <div class="actions">
        <button class="action-btn primary" id="copyBtn">📋 Copy</button>
        <button class="action-btn" id="undoBtn">↩ Undo</button>
        <button class="action-btn" id="clearBtn">✕ Clear</button>
        <button class="action-btn" id="sampleBtn">📝 Sample</button>
      </div>
    </div>
    
    <div class="keyboard-hints">
      <span><kbd>Ctrl</kbd>+<kbd>Z</kbd> Undo</span>
      <span><kbd>T</kbd> Theme</span>
    </div>
  </div>
  
  <footer>
    <a href="https://aikemist.com">aikemist.com</a> · Made by <a href="https://alkemist.no">Alkemist</a>
  </footer>
  
  <div class="toast" id="toast"></div>
  
  <script>
    // Theme
    const html = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    html.setAttribute('data-theme', savedTheme);
    themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
    
    themeToggle.addEventListener('click', () => {
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
    });
    
    // Elements
    const textArea = document.getElementById('textArea');
    const lineCount = document.getElementById('lineCount');
    const charCount = document.getElementById('charCount');
    const uniqueCount = document.getElementById('uniqueCount');
    
    // History for undo
    let history = [];
    
    // Toast
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    
    // Update stats
    function updateStats() {
      const text = textArea.value;
      const lines = text.split('\n');
      lineCount.textContent = text ? lines.length : 0;
      charCount.textContent = text.length;
      uniqueCount.textContent = new Set(lines.filter(l => l.trim())).size;
    }
    
    textArea.addEventListener('input', updateStats);
    
    // Save state for undo
    function saveState() {
      history.push(textArea.value);
      if (history.length > 50) history.shift();
    }
    
    // Tool actions
    const actions = {
      'sort-asc': () => {
        const lines = textArea.value.split('\n');
        return lines.sort((a, b) => a.localeCompare(b)).join('\n');
      },
      'sort-desc': () => {
        const lines = textArea.value.split('\n');
        return lines.sort((a, b) => b.localeCompare(a)).join('\n');
      },
      'sort-num': () => {
        const lines = textArea.value.split('\n');
        return lines.sort((a, b) => {
          const numA = parseFloat(a) || 0;
          const numB = parseFloat(b) || 0;
          return numA - numB;
        }).join('\n');
      },
      'reverse': () => {
        return textArea.value.split('\n').reverse().join('\n');
      },
      'shuffle': () => {
        const lines = textArea.value.split('\n');
        for (let i = lines.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [lines[i], lines[j]] = [lines[j], lines[i]];
        }
        return lines.join('\n');
      },
      'dedupe': () => {
        const lines = textArea.value.split('\n');
        return [...new Set(lines)].join('\n');
      },
      'trim': () => {
        return textArea.value.split('\n').map(l => l.trim()).join('\n');
      },
      'empty': () => {
        return textArea.value.split('\n').filter(l => l.trim()).join('\n');
      },
      'numbers': () => {
        const lines = textArea.value.split('\n');
        const width = String(lines.length).length;
        return lines.map((l, i) => `${String(i + 1).padStart(width, '0')}. ${l}`).join('\n');
      },
      'prefix': () => {
        const prefix = prompt('Enter prefix:', '- ');
        if (prefix === null) return textArea.value;
        return textArea.value.split('\n').map(l => prefix + l).join('\n');
      },
      'suffix': () => {
        const suffix = prompt('Enter suffix:', ',');
        if (suffix === null) return textArea.value;
        return textArea.value.split('\n').map(l => l + suffix).join('\n');
      },
      'wrap': () => {
        const wrap = prompt('Enter wrapper (use %s for line):', '"%s"');
        if (wrap === null) return textArea.value;
        return textArea.value.split('\n').map(l => wrap.replace('%s', l)).join('\n');
      }
    };
    
    // Tool button clicks
    document.querySelectorAll('.tool-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const action = btn.dataset.action;
        if (actions[action]) {
          saveState();
          textArea.value = actions[action]();
          updateStats();
          showToast('Done!');
        }
      });
    });
    
    // Copy
    document.getElementById('copyBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(textArea.value);
      showToast('Copied!');
    });
    
    // Undo
    document.getElementById('undoBtn').addEventListener('click', () => {
      if (history.length > 0) {
        textArea.value = history.pop();
        updateStats();
        showToast('Undone!');
      }
    });
    
    // Clear
    document.getElementById('clearBtn').addEventListener('click', () => {
      saveState();
      textArea.value = '';
      updateStats();
    });
    
    // Sample
    document.getElementById('sampleBtn').addEventListener('click', () => {
      saveState();
      textArea.value = `banana
apple
cherry
apple
date
elderberry
fig
banana
grape`;
      updateStats();
    });
    
    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 't' && document.activeElement !== textArea) {
        themeToggle.click();
      }
    });
    
    // Init
    updateStats();
  </script>
</body>
</html>
